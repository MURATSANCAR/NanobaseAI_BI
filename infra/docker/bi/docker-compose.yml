# NanobaseAI BI — taşınabilir yığın. Müşteriye tek `docker compose up -d` ile gider.
# Ağ `bi_net` dışarıdan da bağlanabilir (NPM konteyneri buraya `docker network connect` ile eklenir,
# böylece ön kapı `web` konteynerine ada göre proxy yapar; host-port hilesi yok).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bi_meta
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: bi_meta
    volumes:
      - bi_pgdata:/var/lib/postgresql/data
    networks: [bi_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_meta -d bi_meta"]
      interval: 10s
      timeout: 5s
      retries: 10

  bridge:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/bridge.Dockerfile
    image: nanobase-bi-bridge:latest
    env_file: .env
    environment:
      # Katalog artık db konteynerinde; SQL doğrudan müşteri sunucusunda (connection.json).
      SEMANTIC_STORE_DSN: postgresql+psycopg2://bi_meta:${PG_PASSWORD}@db:5432/bi_meta
      SEMANTIC_CONNECTION_FILE: /app/secrets/logo-mssql-connection.json
      SEMANTIC_KNOWLEDGE_DIR: /app/configs/semantic/knowledge/logo
      # Kişiye bağlı ekranlar (pano, uyarı, rapor, yönetim) kullanıcıyı giriş servisinden çerezle çözer.
      TIMAS_LOGIN_URL: http://login:8796
      # Yönetim ekranı AD ayarını giriş servisiyle aynı dosyaya yazar.
      AD_CONFIG_FILE: /app/ad/timas-ad.json
      REPORT_DIR: /data/reports
    volumes:
      - ./secrets/logo-mssql-connection.json:/app/secrets/logo-mssql-connection.json:ro
      - ./secrets/ad:/app/ad
      - bi_reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started
    networks: [bi_net]
    restart: unless-stopped

  # Giriş: yalnız Timaş Active Directory (demo/yerel hesap yok). Dışa port açılmaz; web konteyneri çağırır.
  login:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/login.Dockerfile
    image: nanobase-bi-login:latest
    environment:
      # Tarayıcının gördüğü adres; değişiklik yapan isteklerde Origin bununla birebir eşleşmeli.
      PORTAL_ORIGIN: ${PORTAL_ORIGIN}
    volumes:
      - ./secrets/ad:/app/ad:ro
      - bi_login:/data
    networks: [bi_net]
    restart: unless-stopped

  web:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/web.Dockerfile
    image: nanobase-bi-web:latest
    environment:
      CALLER_TOKEN: ${SEMANTIC_CALLER_TOKEN}
      ADMIN_TOKEN: ${SEMANTIC_ADMIN_TOKEN}
    volumes:
      - bi_metrics:/usr/share/nginx/metrics:ro
    ports:
      - "8088:80"          # geçici doğrudan erişim + doğrulama; NPM devreye girince kaldırılabilir
    depends_on: [bridge, login]
    networks: [bi_net]
    restart: unless-stopped

  # Arka plan işleri: ana ekran özeti (3 dk), uyarı (15 dk), pano (15 dk), planlı rapor (5 dk). Mantık köprüde; bu yalnız çağırır.
  jobs:
    image: nanobase-bi-bridge:latest
    command: ["python", "/app/jobs/jobs.py"]
    environment:
      BRIDGE: http://bridge:8795
      SEMANTIC_CALLER_TOKEN: ${SEMANTIC_CALLER_TOKEN}
      OUT: /data/metrics/cfo.json
    volumes:
      - bi_metrics:/data/metrics
    depends_on: [bridge]
    networks: [bi_net]
    restart: unless-stopped

networks:
  bi_net:
    name: bi_net

volumes:
  bi_pgdata:
    name: bi_pgdata
  bi_metrics:
    name: bi_metrics
  bi_login:
    name: bi_login
  bi_reports:
    name: bi_reports
