# NanobaseAI BI — taşınabilir yığın. Müşteriye tek `docker compose up -d` ile gider.
# Ağ `bi_net` dışarıdan da bağlanabilir (NPM konteyneri buraya `docker network connect` ile eklenir,
# böylece ön kapı `web` konteynerine ada göre proxy yapar; host-port hilesi yok).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bi_meta
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: bi_meta
    volumes:
      - bi_pgdata:/var/lib/postgresql/data
    networks: [bi_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_meta -d bi_meta"]
      interval: 10s
      timeout: 5s
      retries: 10

  bridge:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/bridge.Dockerfile
    image: nanobase-bi-bridge:latest
    env_file: .env
    environment:
      # Katalog artık db konteynerinde; SQL doğrudan müşteri sunucusunda (connection.json).
      SEMANTIC_STORE_DSN: postgresql+psycopg2://bi_meta:${PG_PASSWORD}@db:5432/bi_meta
      SEMANTIC_CONNECTION_FILE: /app/secrets/logo-mssql-connection.json
      # Canlı CRM (Timas_MSCRM, .28) ayrı sunucuda: içinde Timas_MSCRM geçen sorgular (editoryal ekranlar, kişi
      # rehberi, yönetim raporları) buraya gider. Dosya yoksa bu sorgular Logo bağlantısına düşer — 2026-09-22'ye
      # kadar VM'de böyleydi ve CRM ekranları Logo sunucusundaki 8 Eylül'de donmuş kopyayı okuyordu.
      SEMANTIC_CRM_CONNECTION_FILE: /app/secrets/crm-mssql-connection.json
      SEMANTIC_KNOWLEDGE_DIR: /app/configs/semantic/knowledge/logo
      # Kişiye bağlı ekranlar (pano, uyarı, rapor, yönetim) kullanıcıyı giriş servisinden çerezle çözer.
      TIMAS_LOGIN_URL: http://login:8796
      # Yönetim ekranı AD ayarını giriş servisiyle aynı dosyaya yazar.
      AD_CONFIG_FILE: /app/ad/timas-ad.json
      REPORT_DIR: /data/reports
    volumes:
      - ./secrets/logo-mssql-connection.json:/app/secrets/logo-mssql-connection.json:ro
      - ./secrets/crm-mssql-connection.json:/app/secrets/crm-mssql-connection.json:ro
      - ./secrets/ad:/app/ad
      - bi_reports:/data/reports
      # Uygulamanın yazdığı durum (rapor önbelleği, Finansal Denetim arşivi, editör verisi): kurulumda silinmez.
      - bi_var:/data/nanobaseai/bi/var
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started
    networks: [bi_net]
    restart: unless-stopped

  # Giriş: yalnız Timaş Active Directory (demo/yerel hesap yok). Dışa port açılmaz; web konteyneri çağırır.
  login:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/login.Dockerfile
    image: nanobase-bi-login:latest
    environment:
      # Tarayıcının gördüğü adres; değişiklik yapan isteklerde Origin bununla birebir eşleşmeli.
      PORTAL_ORIGIN: ${PORTAL_ORIGIN}
      # Müşteri iç ağında HTTP'den açılır (HTTPS yok): çerez Secure olmadan verilir.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Güvenlik ekranı (M49): köprü giriş olaylarını ve oturum listesini bu jetonla okur (.env'de, köprüyle aynı değer;
      # en az 24 karakter). Boşsa giriş kaydı yine yazılır ama köprüye taşınmaz, oturum kapatma çalışmaz.
      LOGIN_ADMIN_TOKEN: ${LOGIN_ADMIN_TOKEN:-}
      # Portal oturumuyla Destek'e tek tıkla giriş (/timas/auth/destek-sso): masa adresi ve ortak imza anahtarı.
      DESTEK_URL: ${DESTEK_URL:-}
      DESTEK_SSO_FILE: /app/destek/destek-sso.key
      # ZEKİ AI Sohbet girişi (/timas/auth/chat-sso): yönetim rolü portal yetkisinden (ozellik:sohbet.yonet) okunur,
      # köprüye kişinin kendi çereziyle sorulur. Dil tercihi boş/İngilizce olan kişi bir kez CHAT_LANGUAGE'e çekilir.
      BRIDGE_URL: http://bridge:8795
      SEMANTIC_CALLER_TOKEN: ${SEMANTIC_CALLER_TOKEN}
      CHAT_ADMIN_FEATURE: ${CHAT_ADMIN_FEATURE:-ozellik:sohbet.yonet}
      CHAT_ADMIN_ROLES: ${CHAT_ADMIN_ROLES:-admin}
      CHAT_LANGUAGE: ${CHAT_LANGUAGE:-tr}
    volumes:
      - ./secrets/ad:/app/ad:ro
      - ./secrets/destek:/app/destek:ro
      - bi_login:/data
    networks: [bi_net]
    restart: unless-stopped

  web:
    build:
      context: ../../..
      dockerfile: infra/docker/bi/web.Dockerfile
    image: nanobase-bi-web:latest
    environment:
      CALLER_TOKEN: ${SEMANTIC_CALLER_TOKEN}
      ADMIN_TOKEN: ${SEMANTIC_ADMIN_TOKEN}
      # NanobaseAI Destek ön kapısı (8446) ve iç model yolu (8447, yalnız bi_net). Boş kalabilir: Destek yoksa
      # 8446 502 verir, model yolu 503. Şablonda tanımsız değişken nginx'i durdurur; bu yüzden varsayılan boş.
      DESTEK_LLM_KEY: ${DESTEK_LLM_KEY:-}
      DESTEK_PUBLIC_ORIGIN: ${DESTEK_PUBLIC_ORIGIN:-}
    volumes:
      - bi_metrics:/usr/share/nginx/metrics:ro
    ports:
      - "8088:80"          # geçici doğrudan erişim + doğrulama; NPM devreye girince kaldırılabilir
      - "8446:8446"        # NanobaseAI Destek (iç ağ, HTTP)
    depends_on: [bridge, login]
    networks: [bi_net]
    restart: unless-stopped

  # Arka plan işleri: test sunucusunun zamanlayıcılarının aynısı, aynı saatlerde (jobs.py, scripts/server/timas-*.timer).
  # Mantık köprüde; bu yalnız çağırır. VM'de kapalı olanlar JOBS_EXCLUDE (basın/web taraması, iç kalite kapıları).
  jobs:
    image: nanobase-bi-bridge:latest
    command: ["python", "/app/jobs/jobs.py"]
    environment:
      BRIDGE: http://bridge:8795
      SEMANTIC_CALLER_TOKEN: ${SEMANTIC_CALLER_TOKEN}
      OUT: /data/metrics/cfo.json
      JOBS_TZ: Europe/Istanbul
      JOBS_EXCLUDE: ${JOBS_EXCLUDE:-timas-web-watch,timas-model-quality-*}
    volumes:
      - bi_metrics:/data/metrics
    depends_on: [bridge]
    networks: [bi_net]
    restart: unless-stopped

networks:
  bi_net:
    name: bi_net

volumes:
  bi_pgdata:
    name: bi_pgdata
  bi_metrics:
    name: bi_metrics
  bi_login:
    name: bi_login
  bi_reports:
    name: bi_reports
  bi_var:
    name: bi_var
