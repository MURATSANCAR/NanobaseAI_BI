# ZEKİ AI (Timaş) — müşterinin Nginx Proxy Manager'ı için özel ayar.
# NPM, /data/nginx/custom/http.conf dosyasını kendi http bloğuna ekler (resmi özel ayar yolu; panelde görünmez).
# Giriş çerezi Secure olduğu için arayüz HTTPS'ten açılır; HTTP yalnız HTTPS'e yönlendirir.
# Sertifika: 192.168.0.55 için kendinden imzalı (alan adı yok, Let's Encrypt veremez); tarayıcı ilk girişte bir kez uyarır.
# Kurulum (VM'de; NPM /data = /opt/nginx-proxy-manager/data):
#   docker exec nginx-proxy-manager-app-1 mkdir -p /data/nginx/custom /data/custom_ssl/zeki
#   docker exec nginx-proxy-manager-app-1 openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -subj /CN=192.168.0.55 -addext subjectAltName=IP:192.168.0.55 \
#     -keyout /data/custom_ssl/zeki/privkey.pem -out /data/custom_ssl/zeki/fullchain.pem
#   docker exec -i nginx-proxy-manager-app-1 sh -c 'cat > /data/nginx/custom/http.conf' < npm-custom-http.conf
#   docker exec nginx-proxy-manager-app-1 nginx -t && docker exec nginx-proxy-manager-app-1 nginx -s reload
# NPM, bi_net ağına bağlı olmalı (docker network connect bi_net nginx-proxy-manager-app-1).
# Alan adı gelince bunun yerine NPM panelinden proxy host + Let's Encrypt eklenebilir: hedef bi-web-1, port 80.
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.0.55;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.0.55;
    ssl_certificate /data/custom_ssl/zeki/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/zeki/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location / {
        # Web konteyneri yeniden kurulunca iç adresi değişir; adı her istekte Docker DNS'inden çöz.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $zeki_web http://bi-web-1:80;
        proxy_pass $zeki_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
