# Nanobase BI Text-to-SQL — production infra (server only)
#
# Reuses existing:
#   - Qdrant          127.0.0.1:6333  (docker-compose-qdrant-1)
#   - bi_meta Postgres 127.0.0.1:5434 (nanobase-bi-meta-db)
#   - BGE-M3          127.0.0.1:8083  (docker-compose-embedding-service-1)
#
# Starts:
#   - reporting Postgres (NL2SQL seed + RO role) on 127.0.0.1:5435
#
# Deploy:
#   ./scripts/server/deploy-infra.sh

services:
  reporting-postgres:
    image: postgres:16-alpine
    container_name: nanobase-bi-reporting-db
    environment:
      POSTGRES_DB: bi_reporting
      POSTGRES_USER: bi_reporting_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/reporting_admin_password
    secrets:
      - reporting_admin_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - /data/nanobaseai/bi/infra/reporting-pg:/var/lib/postgresql/data
      - ./sql/01-reporting-seed.sql:/docker-entrypoint-initdb.d/01-reporting-seed.sql:ro
      - ./sql/02-reporting-ro-user.sh:/docker-entrypoint-initdb.d/02-reporting-ro-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_reporting_admin -d bi_reporting"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - bi_infra

secrets:
  reporting_admin_password:
    file: /data/nanobaseai/bi/secrets/reporting-admin.password

networks:
  bi_infra:
    name: nanobase-bi-infra
    driver: bridge
