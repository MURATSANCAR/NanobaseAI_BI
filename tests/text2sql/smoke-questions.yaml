# 50-question Text-to-SQL smoke suite (bi_reporting / analytics)
# Staging target: 200-Q (see docs/architecture/phase-6/acceptance.md)
# expect_tables: bare table names that retrieval should surface
datasource: bi_reporting
collection: bi_schema_bi_reporting
pass_threshold: 0.80

