#
# expect:
#   answer   → cevap üretilmeli (katalogdan ya da modelden)
#   refuse   → sistem cevap vermemeli (belirsiz, kapsam dışı, veri yok, güvenlik)
#   clarify  → belirsizlik bildirilmeli (dönem/ölçü netleşmeden SQL üretilmemeli)
version: 1
