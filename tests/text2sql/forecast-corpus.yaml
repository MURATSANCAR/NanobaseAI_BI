# Forecasting V1 — chat-level acceptance corpus (plan Faz 0.6 / 4.4).
# Run: python3 tests/text2sql/run-forecast-eval.py --api http://127.0.0.1:8790 --datasource bi_reporting
#
# expect: done      → phases must include forecast_done, done.intent == "forecast",
#                     done.sql_source == semantic_metric_compiler, no LLM plan phase
#         declined  → phase forecast_declined with the given code, no LLM plan phase
#         llm       → NOT a forecast question: forecast_* phases must be absent
version: 1
cases:
  - id: fc-001
    question: "İstanbul satışları önümüzdeki 6 ay nasıl?"
    expect: done
    horizon: 6
    dimension: { branch_city: "İstanbul" }
  - id: fc-002
    question: "Toplam ciro için gelecek 3 çeyrek tahmini"
    expect: done
    horizon: 3
  - id: fc-003
    question: "Ankara cirosu önümüzdeki 12 ay ne olur?"
    expect: done
    horizon: 12
    dimension: { branch_city: "Ankara" }
  - id: fc-004
    question: "Satılan adet önümüzdeki 4 ay tahmini"
    expect: done
    horizon: 4
  - id: fc-005
    question: "Segment bazında önümüzdeki 6 ay satış tahmini"
    expect: declined
    code: UNSUPPORTED_SHAPE
  - id: fc-006
    question: "Önümüzdeki 30 gün satış tahmini"
    expect: declined
    code: UNSUPPORTED_GRAIN
  - id: fc-007
    question: "Toplam ciro nedir?"
    expect: llm
  - id: fc-008
    question: "Bu sorgunun tahmini maliyeti nedir?"
    expect: llm
