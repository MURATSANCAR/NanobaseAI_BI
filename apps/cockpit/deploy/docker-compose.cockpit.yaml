# WrenAI compose'una ek dosya — mevcut servislere dokunmaz, önlerine kokpiti koyar.
# Kullanım (sunucuda, WrenAI/docker dizininde):
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
#     -f /data/nanobaseai/bi/frontend/apps/cockpit/deploy/docker-compose.cockpit.yaml up -d --build cockpit
services:
  cockpit:
    build:
      context: /data/nanobaseai/bi/frontend/apps/cockpit
      dockerfile: deploy/Dockerfile
    image: nanobaseai/bi-cockpit:0.1.0
    depends_on:
      - wren-ui
    ports:
      - "127.0.0.1:3100:80"   # reverse proxy bunun önüne konur (TLS)
    restart: unless-stopped
