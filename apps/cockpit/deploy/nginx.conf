server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GraphQL + REST → semantik motor arayüz servisi (aynı compose ağı)
    location /api/ {
        proxy_pass         http://semantic-bridge:8795/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # NL→SQL isteği LLM'de uzun sürebilir
        proxy_send_timeout 600s;
        proxy_buffering    off;    # stream uçları için
    }

    location / {
        try_files $uri /index.html;
    }
}
