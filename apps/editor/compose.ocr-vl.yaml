services:
  ocr-vl:
    image: ${EDITOR_OCR_VL_IMAGE:-nanobase-editor-ocr-vl:1.6-20260917}
    profiles: [ocr-vl]
    network_mode: none
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=512m,mode=1777']
    volumes: [artifacts:/data/artifacts]
    cpus: 4
    cpu_shares: 128
    mem_limit: 10g
    pids_limit: 256
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
