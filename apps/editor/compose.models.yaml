# Optional qualified-host CPU lane; all model traffic stays on the private network.
# Enable with COMPOSE_FILE=compose.yaml:compose.models.yaml and COMPOSE_PROFILES=models in .env.
x-model: &model
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:79903855d3de1689e9856219283591be12ba6f40a8e65fc7223824109446ad88
  profiles: [models]
  restart: unless-stopped
  networks: [private]
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=64m,mode=1777']
  volumes: ['./runtime/models:/models:ro']
  pids_limit: 128
  cpu_shares: 128
  environment:
    HF_HUB_OFFLINE: '1'
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
  healthcheck:
    test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8080/health']
    interval: 20s
    timeout: 8s
    retries: 12
    start_period: 120s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  llm:
    <<: *model
    cpus: 4
    mem_limit: 32g
    command: [--model, /models/Qwen3.8-27B-Q4_K_M.gguf, --mmproj, /models/mmproj-Qwen3.8-27B-Q8_0.gguf, --alias, editor-qwen38, --host, 0.0.0.0, --port, '8080', --ctx-size, '8192', --threads, '4', --threads-batch, '4', --parallel, '1', --batch-size, '256', --ubatch-size, '128', --image-max-tokens, '${EDITOR_IMAGE_MAX_TOKENS:-256}', --jinja, --reasoning, 'off', --metrics, --no-webui]
  embedding:
    <<: *model
    cpus: 1
    mem_limit: 2g
    command: [--model, /models/bge-m3-Q8_0.gguf, --alias, editor-embedding, --host, 0.0.0.0, --port, '8080', --embedding, --pooling, cls, --ctx-size, '2048', --threads, '1', --threads-batch, '1', --parallel, '1', --batch-size, '2048', --ubatch-size, '2048', --no-webui]
  reranker:
    <<: *model
    cpus: 1
    mem_limit: 2g
    command: [--model, /models/bge-reranker-v2-m3-Q8_0.gguf, --alias, editor-reranker, --host, 0.0.0.0, --port, '8080', --reranking, --ctx-size, '2048', --threads, '1', --threads-batch, '1', --parallel, '1', --batch-size, '2048', --ubatch-size, '2048', --no-webui]
