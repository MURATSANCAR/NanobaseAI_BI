# Editor stack on the TT GPU host (tt-gpu). Everything here belongs to the
# editor; nothing is shared with BI (own Postgres, own Qdrant, own Temporal,
# own model copies under /data/editor/models, own network).
#
# Model containers are not in this file: the gateway creates, starts and stops
# them from deploy/models.yaml on demand (see gateway.py). `editorctl down`
# stops the core services too, leaving no editor process running.
#
# Paths on the host: EDITOR_ROOT (default /data/editor).
name: editor

x-py: &py
  # No default version: a service started without the variable used to fall back to an old image
  # silently (2026-09-23: control and rebuild ran 0.15.3 while the tree was at 0.15.8). editorctl
  # sets both variables from VERSION; a bare `docker compose` without them stops with this message.
  image: ${EDITOR_PY_IMAGE:?EDITOR_PY_IMAGE ayarlanmadı - editorctl ile kurun}
  restart: unless-stopped
  env_file: ${EDITOR_ROOT:-/data/editor}/secrets/editor.env
  environment:
    EDITOR_ROOT: /data/editor
    EDITOR_MODELS_YAML: /app/deploy/models.yaml
  volumes:
    - ${EDITOR_ROOT:-/data/editor}/storage:/data/editor/storage
  networks: [editor-net]

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: editor-postgres
    restart: unless-stopped
    env_file: ${EDITOR_ROOT:-/data/editor}/secrets/postgres.env
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/pg:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:19130:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d editor"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [editor-net]

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: editor-qdrant
    restart: unless-stopped
    env_file: ${EDITOR_ROOT:-/data/editor}/secrets/qdrant.env
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/qdrant:/qdrant/storage
    networks: [editor-net]

  temporal-schema:
    image: temporalio/admin-tools:1.32.0
    container_name: editor-temporal-schema
    restart: "no"
    env_file: ${EDITOR_ROOT:-/data/editor}/secrets/postgres.env
    entrypoint: ["/bin/sh", "/setup/temporal-schema.sh"]
    volumes:
      - ./temporal:/setup:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [editor-net]

  temporal:
    image: temporalio/server:1.32.0
    container_name: editor-temporal
    restart: unless-stopped
    entrypoint: ["temporal-server", "--config-file", "/etc/temporal/config/server.yaml", "--allow-no-auth", "start"]
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/temporal/server.yaml:/etc/temporal/config/server.yaml:ro
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':7233 '"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [editor-net]

  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: editor-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: editor-temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: editor
    ports:
      - "127.0.0.1:19120:8080"
    depends_on:
      temporal: {condition: service_healthy}
    networks: [editor-net]

  control:
    <<: *py
    container_name: editor-control
    command: ["uvicorn", "editor.control:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/storage:/data/editor/storage:ro
    ports:
      - "127.0.0.1:19140:8000"
    depends_on:
      postgres: {condition: service_healthy}

  cards:
    <<: *py
    image: ${EDITOR_CARDS_IMAGE:-${EDITOR_PY_IMAGE:?EDITOR_PY_IMAGE ayarlanmadı - editorctl ile kurun}}
    env_file:
      - ${EDITOR_ROOT:-/data/editor}/secrets/editor.env
      - ${EDITOR_ROOT:-/data/editor}/secrets/cards.env
    container_name: editor-cards
    command: ["uvicorn", "editor.card_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/storage:/data/editor/storage:ro
    ports:
      - "127.0.0.1:19141:8000"
    depends_on:
      postgres: {condition: service_healthy}

  # Kitap Tasarım Stüdyosu (editor.production.api): basıma hazırlık işleri ve sayfa düzenleme.
  # Depoya yazar (production/), görsel modeli gateway'deki book-image takma adıyla çağırır.
  studio:
    <<: *py
    env_file:
      - ${EDITOR_ROOT:-/data/editor}/secrets/editor.env
      - ${EDITOR_ROOT:-/data/editor}/secrets/cards.env
    container_name: editor-studio
    command: ["uvicorn", "editor.production.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:19142:8000"
    depends_on:
      postgres: {condition: service_healthy}

  # Stüdyonun GPU işleri (editor.production.flow): Temporal `editor-production` kuyruğu, aynı anda tek
  # etkinlik. Stüdyo API'si yalnız iş akışını başlatır; API yeniden başlasa da iş sürer.
  studio-worker:
    <<: *py
    env_file:
      - ${EDITOR_ROOT:-/data/editor}/secrets/editor.env
      - ${EDITOR_ROOT:-/data/editor}/secrets/cards.env
    container_name: editor-studio-worker
    command: ["python", "-m", "editor.production.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}

  gateway:
    <<: *py
    profiles: [analysis]
    container_name: editor-gateway
    command: ["uvicorn", "editor.gateway:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      EDITOR_ROOT: /data/editor
      EDITOR_MODELS_YAML: /app/deploy/models.yaml
      EDITOR_HOST_ROOT: ${EDITOR_ROOT:-/data/editor}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    runtime: nvidia
    volumes:
      # The gateway starts and stops ONLY containers labelled editor.model
      # (enforced in gateway.py); it needs the socket for that.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${EDITOR_ROOT:-/data/editor}/models/MANIFEST.json:/data/editor/models/MANIFEST.json:ro
    ports:
      - "127.0.0.1:19100:8000"

  # Character identity embeddings (CCIP): a small ONNX model in its own image (onnxruntime
  # has no wheels for the Python the rest runs on). Milliseconds per crop, so it stays up
  # with the analysis services instead of being started on demand like the big models.
  embed:
    image: editor-embed:latest
    profiles: [analysis]
    container_name: editor-embed
    restart: unless-stopped
    environment:
      HF_HOME: /models/hf
      EDITOR_CCIP_MODEL: ${EDITOR_CCIP_MODEL:-ccip-caformer_b36-24}
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    runtime: nvidia
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/models/hf:/models/hf
    networks: [editor-net]

  mcp:
    <<: *py
    profiles: [analysis]
    container_name: editor-mcp
    command: ["python", "-m", "editor.mcp_servers"]
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    <<: *py
    profiles: [analysis]
    container_name: editor-worker
    command: ["python", "-m", "editor.workflow.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}

  rebuild:
    <<: *py
    profiles: [analysis]
    container_name: editor-rebuild
    command: ["python", "-m", "editor.rebuild", "consume"]
    depends_on:
      postgres: {condition: service_healthy}
      gateway: {condition: service_started}

  hermes:
    profiles: [analysis]
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: editor-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: ${EDITOR_ROOT:-/data/editor}/secrets/hermes.env
    environment:
      HERMES_SKIP_CONFIG_MIGRATION: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_MODEL_NAME: book-director
    volumes:
      - ${EDITOR_ROOT:-/data/editor}/hermes:/opt/data
    ports:
      - "127.0.0.1:19110:8642"
    depends_on:
      - gateway
      - mcp
    networks: [editor-net]

networks:
  editor-net:
    name: editor-net
    driver: bridge
