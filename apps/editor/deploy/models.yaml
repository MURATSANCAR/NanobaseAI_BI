# Model Gateway alias table (NIHAI-KARAR.md §2, §6).
#
# GPU placement (2026-09-19, user decision): BI's qwen38-27b runs alone on
# GPU 0; the whole editor (every alias below) lives on GPU 1. Models that do
# not fit together are swapped by the gateway (idle editor models stop first).
# Hermes and the analysis workers only ever see the alias. The real model,
# revision and GPU live here and in the ledger's model_call provenance rows.
#
# Every model runs in its own vLLM container that is CREATED but not started
# (`editorctl install`). The gateway starts a container on the first request
# for its alias and stops it after `idle_stop_sec` with no traffic, so an idle
# editor holds no GPU memory.
#
# mem_fraction is vLLM's --gpu-memory-utilization for that one container: the
# share of the card this model may take. Models on the same GPU whose fractions
# add up to <= 0.92 can run together; otherwise the gateway stops the idle
# editor model(s) on that card first. It never touches a container that is not
# an editor model.

# Every chat model forbids free whitespace in JSON output: a schema-guided decode
# may otherwise spin on tabs/newlines until max_tokens (seen on a real page).
defaults:
  image: vllm/vllm-openai:v0.29.0
  idle_stop_sec: 600
  start_timeout_sec: 1800

aliases:
  book-director:
    # The main model: never stopped for being idle (user decision 2026-09-22). It gives way
    # only to a model that needs the whole card, and comes back when the card is free.
    always_on: true
    container: editor-model-director
    model_dir: Qwen3.8-27B-FP8
    real_model: Qwen/Qwen3.8-27B-FP8
    role: Planlama, sentez, özet, karar
    kind: chat
    gpu: 1
    mem_fraction: 0.48
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=131072
      - --max-num-seqs=32
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'

  book-embedding:
    container: editor-model-embedding
    model_dir: Qwen3-Embedding-8B
    real_model: Qwen/Qwen3-Embedding-8B
    role: Kitap/karakter/olay semantik araması
    kind: embedding
    gpu: 1
    mem_fraction: 0.21
    args:
      - --runner=pooling
      - --convert=embed
      - --max-model-len=8192

  book-reranker:
    container: editor-model-reranker
    model_dir: Qwen3-Reranker-8B
    real_model: Qwen/Qwen3-Reranker-8B
    role: Kanıt ve sayfa sıralaması
    kind: rerank
    gpu: 1
    mem_fraction: 0.23
    args:
      - --runner=pooling
      - --convert=classify
      - --max-model-len=8192
      - '--hf-overrides={"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'

  book-vision-fast:
    container: editor-model-vision-fast
    model_dir: Qwen3-VL-8B-Instruct
    real_model: Qwen/Qwen3-VL-8B-Instruct
    role: Tüm sayfaların hızlı taranması
    kind: chat
    gpu: 1
    mem_fraction: 0.40
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=32768
      - --max-num-seqs=32
      - --enable-prefix-caching
      - '--limit-mm-per-prompt={"image":4,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":2408448}'

  # OCR candidate: a 0.9B OCR specialist (Apache-2.0). Not used by the workflow; it is
  # measured against the current reader with `python -m editor.measure_ocr` on the pages
  # where OCR has hurt most. General VLMs "correct" what they read (measured on our pages:
  # "oynayabiliyoruz" -> "oynayabiliriz"); OCR specialists are reported to do that far less.
  book-ocr-paddle:
    container: editor-model-ocr-paddle
    model_dir: PaddleOCR-VL-1.6
    real_model: PaddlePaddle/PaddleOCR-VL-1.6
    role: Aday — OCR uzmanı (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.10
    args:
      - --trust-remote-code
      - --max-model-len=16384
      - --max-num-seqs=32
      - --no-enable-prefix-caching
      - '--limit-mm-per-prompt={"image":1,"video":0}'

  # OCR candidates found on Hugging Face (2026-09-22): the most used OCR models that list
  # Turkish or are multilingual and allow commercial use (Chandra: OpenRAIL, paid above $2M
  # revenue — measured only). Each runs alone for `editor.measure_ocr`; none is used by the
  # workflow until it wins on our hardest pages. Losers are removed with their weights.
  book-ocr-unlimited:
    container: editor-model-ocr-unlimited
    model_dir: Unlimited-OCR
    real_model: baidu/Unlimited-OCR
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=32768
      - --max-num-seqs=1       # batching >1 crashes the engine in vLLM 0.29 (tensor size 4 vs 3)
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code

  book-ocr-dots:
    container: editor-model-ocr-dots
    model_dir: dots.mocr
    real_model: dots-studio/dots.mocr
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=32768
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code
      - --chat-template-content-format=string

  book-ocr-deepseek2:
    container: editor-model-ocr-deepseek2
    model_dir: DeepSeek-OCR-2
    real_model: deepseek-ai/DeepSeek-OCR-2
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=8192
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0
      - --logits-processors=vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor

  book-ocr-hunyuan:
    container: editor-model-ocr-hunyuan
    model_dir: HunyuanOCR
    real_model: tencent/HunyuanOCR
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=32768
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0

  book-ocr-qianfan:
    container: editor-model-ocr-qianfan
    model_dir: Qianfan-OCR
    real_model: baidu/Qianfan-OCR
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=32768
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code

  book-ocr-chandra:
    container: editor-model-ocr-chandra
    model_dir: chandra-ocr-2
    real_model: datalab-to/chandra-ocr-2
    role: Aday — OCR (kıyaslama)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=32768
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'

  book-vision-deep:
    container: editor-model-vision-deep
    model_dir: Qwen3-VL-32B-Thinking
    real_model: Qwen/Qwen3-VL-32B-Thinking
    role: Zor görsel, karakter ve sahne analizi
    kind: chat
    gpu: 1
    mem_fraction: 0.90
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=40960
      - --max-num-seqs=8
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - '--limit-mm-per-prompt={"image":6,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":2408448}'

  # Same model in FP8 (35 GB instead of 67 GB): a candidate, not used by the workflow.
  # `python -m editor.compare_models` reads the same pages with both and reports the
  # differences; switching is a one-line change of book-vision-deep's model_dir.
  book-vision-deep-fp8:
    container: editor-model-vision-deep-fp8
    model_dir: Qwen3-VL-32B-Thinking-FP8
    real_model: Qwen/Qwen3-VL-32B-Thinking-FP8
    role: Aday — derin görsel modelin FP8 sürümü (kalite karşılaştırması)
    kind: chat
    gpu: 1
    mem_fraction: 0.50
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=40960
      - --max-num-seqs=16
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - '--limit-mm-per-prompt={"image":6,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":2408448}'
