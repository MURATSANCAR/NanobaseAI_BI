# Model Gateway alias table (NIHAI-KARAR.md §2, §6).
#
# GPU placement (2026-09-19, user decision): BI's qwen38-27b runs alone on
# GPU 0; the whole editor (every alias below) lives on GPU 1. Models that do
# not fit together are swapped by the gateway (idle editor models stop first).
# Callers (card service, analysis workers) only ever see the alias. The real model,
# revision and GPU live here and in the ledger's model_call provenance rows.
#
# Every model runs in its own vLLM container that is CREATED but not started
# (`editorctl install`). The gateway starts a container on the first request
# for its alias and stops it after `idle_stop_sec` with no traffic, so an idle
# editor holds no GPU memory.
#
# mem_fraction is vLLM's --gpu-memory-utilization for that one container: the
# share of the card this model may take. Models on the same GPU whose fractions
# add up to <= 0.92 can run together; otherwise the gateway stops the idle
# editor model(s) on that card first. It never touches a container that is not
# an editor model.

# Every chat model forbids free whitespace in JSON output: a schema-guided decode
# may otherwise spin on tabs/newlines until max_tokens (seen on a real page).
defaults:
  image: vllm/vllm-openai:v0.29.0
  idle_stop_sec: 600
  start_timeout_sec: 1800

aliases:
  book-director:
    # The main model: never stopped for being idle (user decision 2026-09-22). It gives way
    # only to a model that needs the whole card, and comes back when the card is free.
    always_on: true
    # The same weights as BI's model on GPU 0, so it also answers as `nanobaseAI`: while no
    # book is being read, the dispatcher in front of both cards shares BI prompts between them
    # (user decision 2026-09-23). When an analysis takes the card this model gives way and the
    # dispatcher sends everything to GPU 0.
    also_serves: [nanobaseAI]
    container: editor-model-director
    model_dir: Qwen3.8-27B-FP8
    real_model: Qwen/Qwen3.8-27B-FP8
    role: Planlama, sentez, özet, karar
    kind: chat
    gpu: 1
    # 0.48 → 0.70 (2026-10-02, arşiv okuması). Ölçüldü: 0.48'de ağırlık 29,07 GiB + ek 4,35 GiB, KV 11,5 GiB =
    # 161.826 token; okuma isteği ~11,5k token tutuyor, KV 13-15 eşzamanlı istekte doluyor (koltuk 32). 0.70'te
    # KV ≈ 65,5 - 29,07 - 4,35 = 32,1 GiB ≈ 452k token (14.072 token/GiB, GPU 0'daki aynı modelle tutarlı):
    # 32 koltuğun hepsi geri çekilmeden dolar. Birlikte sığanlar (FIT_TOGETHER 0.92): OCR 0.22, embedding 0.21,
    # reranker 0.22, ses 0.12 (+büyütücü 0.06). Sığmayanlar zaten tek başına kartı alanlar (derin görsel 0.90,
    # resim 0.62) ve son 24 saatte hiç açılmamış hızlı görsel (0.40): açılırsa ana model yer verir, bekçi geri kaldırır.
    mem_fraction: 0.70
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=131072
      - --max-num-seqs=32
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --enable-prefix-caching
      # Etkileşimli öncelik (2026-10-03): gateway sohbet isteğine `priority` koyar (Kitaba sor/kart 0, okuma 10;
      # EDITOR_INTERACTIVE_PRIORITY / EDITOR_ANALYSIS_PRIORITY). Küçük sayı önce: koltuk boşalınca soru sıradaki
      # yüzlerce okuma isteğinin önüne geçer, KV darlığında önce okuma geri çekilir. vLLM 0.29.0'da var
      # (SchedulerPolicy = fcfs|priority). Gateway alanı yalnız çalışan kap bu argümanla açıldıysa gönderir.
      - --scheduling-policy=priority
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'

  book-embedding:
    container: editor-model-embedding
    model_dir: Qwen3-Embedding-8B
    real_model: Qwen/Qwen3-Embedding-8B
    role: Kitap/karakter/olay semantik araması
    kind: embedding
    gpu: 1
    mem_fraction: 0.21
    # GPU kopyası kapalıyken küçük istekler (en çok EDITOR_CPU_TWIN_MAX_INPUTS girdi; sorgu = 1) CPU eşine gider.
    cpu_twin: book-embedding-cpu
    args:
      - --runner=pooling
      - --convert=embed
      - --max-model-len=8192

  # Aynı ağırlıklar CPU'da (2026-10-02): derin görsel model kartın %90'ını tutarken Kitaba sor'un sorgu embedding'i
  # kartta yer bulamadı (gateway «card 1 busy with another model, request waits»). GPU 0'da yer yok: ölçüldü,
  # 95,8 GB'ın 82,4'ü dolu (BI 78,9 + tahmin servisi 3,6), boş 13,4 GB < ağırlık 15 GB. CPU'da (Xeon 6740P, AMX bf16,
  # 32 çekirdek) tek soru 0,15 sn, dizindeki GPU vektörleriyle kosinüs 0,9999; RAM 16 GB (sunucuda 2 TB).
  # Yeniden sıralayıcı CPU'ya taşınmadı: 40 aday 39 sn sürdü; Kitaba sor onu beklemez (x-editor-no-wait).
  # Toplu dizinleme GPU kopyasında kalır. Sürekli açık: ilk soru açılış beklemez. İmaj: editorctl install.
  book-embedding-cpu:
    always_on: true
    container: editor-model-embedding-cpu
    model_dir: Qwen3-Embedding-8B
    real_model: Qwen/Qwen3-Embedding-8B
    role: Soru embedding'i (CPU; GPU kopyası kapalıyken)
    kind: embedding
    gpu: -1
    cpus: 32
    mem_fraction: 0.0
    image: editor-embed-cpu:1
    env:
      EMBED_CPU_THREADS: "32"
    args:
      - --max-model-len=8192

  book-reranker:
    container: editor-model-reranker
    model_dir: Qwen3-Reranker-8B
    real_model: Qwen/Qwen3-Reranker-8B
    role: Kanıt ve sayfa sıralaması
    kind: rerank
    gpu: 1
    # 0.23 → 0.22 (2026-10-02): ana model 0.70 ile toplam 0.92. Ölçüldü: ağırlık 14,11 GiB, KV 0.23'te 5,92 GiB;
    # 0.22'de ~4,98 GiB (embedding 0.21'de 4,06 GiB ile çalışıyor; 8192 bağlam).
    mem_fraction: 0.22
    args:
      - --runner=pooling
      - --convert=classify
      - --max-model-len=8192
      - '--hf-overrides={"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'

  book-vision-fast:
    container: editor-model-vision-fast
    model_dir: Qwen3-VL-8B-Instruct
    real_model: Qwen/Qwen3-VL-8B-Instruct
    role: Tüm sayfaların hızlı taranması
    kind: chat
    gpu: 1
    mem_fraction: 0.40
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=32768
      - --max-num-seqs=32
      - --enable-prefix-caching
      - '--limit-mm-per-prompt={"image":4,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":2408448}'

  # OCR. Chosen 2026-09-22 by `editor.measure_ocr` on the 39 pages where OCR had hurt most
  # (six books; truth = words two independent parsers of the digital layer agree on):
  #   dots.mocr 2.3% word error / 0.5% "corrected" / 0 loops  <- the reader (MIT)
  #   DeepSeek-OCR-2 3.1% (runner-up, kept), Tesseract 3.4% (CPU), Qwen3-VL-8B 4.1% / 8 loops,
  #   Qianfan 4.3%, Unlimited-OCR 7.1% (crashes when batched), PaddleOCR-VL 8.3% (drops ı ğ ş ç),
  #   HunyuanOCR does not start in vLLM 0.29, Chandra 2 3.0% but paid above $2M revenue.
  book-ocr-dots:
    container: editor-model-ocr-dots
    model_dir: dots.mocr
    real_model: dots-studio/dots.mocr
    role: Sayfa OCR okuyucusu (resimli ve dijital metni bozuk sayfalar)
    kind: chat
    gpu: 1
    # 0.30 → 0.22 (2026-10-02): okuma sırasında ana modelle (0.70) birlikte sığsın (0.92). Ölçüldü: ağırlık 5,87 GiB,
    # KV 0.30'da 18,07 GiB = 676.800 token (37,4k token/GiB); 0.22'de ~10,6 GiB ≈ 396k token = 32k bağlamın 12 katı,
    # 16 koltuk × sayfa başı birkaç bin token için bol.
    mem_fraction: 0.22
    args:
      - --max-model-len=32768
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code
      - --chat-template-content-format=string

  book-ocr-deepseek2:
    container: editor-model-ocr-deepseek2
    model_dir: DeepSeek-OCR-2
    real_model: deepseek-ai/DeepSeek-OCR-2
    role: Yedek OCR okuyucusu (kıyaslamada ikinci)
    kind: chat
    gpu: 1
    mem_fraction: 0.30
    args:
      - --max-model-len=8192
      - --max-num-seqs=16
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - --trust-remote-code
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0
      - --logits-processors=vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor

  book-vision-deep:
    container: editor-model-vision-deep
    model_dir: Qwen3-VL-32B-Thinking
    real_model: Qwen/Qwen3-VL-32B-Thinking
    role: Zor görsel, karakter ve sahne analizi
    kind: chat
    gpu: 1
    mem_fraction: 0.90
    # Kartın %90'ını tek başına tutar ve ana model (director) onunla sığmaz. Belge parse
    # seyrek olduğundan, son sayfadan sonra kartı hızlı bıraksın (varsayılan 600 yerine 120):
    # reaper deep-VL'i 2 dk boşta durdurur, warmer director'ı ~30 sn içinde geri ısıtır. Bir
    # belgenin sayfaları peş peşe işlendiği için bu, analizi ortasında kesmez.
    idle_stop_sec: 120
    args:
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-model-len=40960
      # 8 → 12 (2026-10-02). Ölçüldü (44 istek): istem ≤5k token (çoğu 1-2k), üretim ort. 2,6k, %11'i 5-10k; istek
      # sonunda ort. ~4,2k token. KV 77.392 token: 8 koltuk dolu iken KV %29. 12 koltukta ortalama ~50k (%65); iki
      # uzun (15k) istekle ~72k (%93) — taşarsa vLLM geri çekip yeniden hesaplar (şimdiye dek geri çekme 0).
      - --max-num-seqs=12
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - '--limit-mm-per-prompt={"image":6,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":2408448}'

  # Kitap görselleri (kapak, iç resim, tanıtım) — kullanıcı kararı 2026-09-24. Diffusion model,
  # vLLM-Omni ile sunulur: POST /v1/images/generations (metinden görsel), referanslı düzenleme
  # JSON /v1/chat/completions ile. Diğerleri gibi ilk istekte açılır, boşta kapanır.
  # Lisans: ticari lisans alındı (kullanıcı kararı 2026-09-29); çıktı basılabilir, taslak işareti yok.
  # İmaj: 2.1 desteği vLLM-Omni sürümüne henüz girmedi (PR #7759); ekibin yayınladığı
  # `qwen-image21` imajı digest ile sabit. Sürüme girince buradan değiştirilir.
  book-image:
    container: editor-model-image
    model_dir: Qwen-Image-2.1
    real_model: Qwen/Qwen-Image-2.1
    role: Kapak ve iç görsel üretimi
    kind: image
    gpu: 1
    # Ölçüldü 2026-09-24 (H100 NVL, BF16): açılış 40 sn, boşta 33 GB; 1,57 MP üretimde 46 GB, 4,2 MP'de
    # ~55 GB. Ana model (45 GB) aynı kartta açıkken büyük resim ve uzun süre açık kalınca (bellek
    # parçalanması 47,7 GB) bellek aşımı veriyor. 0.62 payı, gateway'in açılıştan önce ana modeli durdurmasını
    # sağlar (analiz modelleriyle aynı düzen: BI soruları o sırada dağıtıcıdan GPU 0'a gider, görsel
    # model 10 dk boşta kalınca kapanır, ana model geri gelir). Görsel 300 dpi'ya yakın (4,2 MP) üretilir.
    mem_fraction: 0.62
    # Tam koşu bitince hat modeli hemen kapatır (Painter.release); stüdyoda art arda düzeltmeler için
    # boşta 5 dk bekler, sonra kapanır ve ana model geri kalkar.
    idle_stop_sec: 300
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    image: vllm/vllm-omni@sha256:38c59f79fd8fc4831348a3d800a882833a1ca1c50a67458988d693f3aa80360c
    entrypoint: [vllm, serve]      # bu imajda giriş komutu yok
    args:
      - --omni
      # CUDA grafiği kapalı: model her istek biçimi (istem uzunluğu × referans görsel sayısı) için ayrı grafik
      # saklıyor, bellek resim resim büyüyüp aşıyordu (ölçüldü 2026-09-24: 25 resimden sonra 92,7 GB).
      - --enforce-eager

  # Resim büyütme (Real-ESRGAN x4plus, BSD-3): üretilen resim 300 dpi hedef ölçüye bununla getirilir;
  # Lanczos yalnız bu servis açılamazsa yedektir. Küçük (≈2 GB), görsel modelle aynı kartta birlikte sığar.
  # İmaj yerelde kurulur (editorctl install: images/upscale/Dockerfile); ağırlık MANIFEST'te sha256 ile.
  book-upscale:
    container: editor-model-upscale
    model_dir: RealESRGAN_x4plus
    real_model: xinntao/Real-ESRGAN/RealESRGAN_x4plus
    role: Resim büyütme (baskı çözünürlüğü)
    kind: upscale
    gpu: 1
    mem_fraction: 0.06
    idle_stop_sec: 300
    image: editor-upscale:1
    entrypoint: [python, /srv/server.py]
    args: []

  # Sesli okuma (kullanıcı kararı 2026-09-26): VoxCPM2 seslendirme (OpenBMB, Apache-2.0) + Türkçe CTC zorla
  # hizalama (Baybars/wav2vec2-xls-r-300m-cv8-turkish, Apache-2.0) tek serviste, POST /v1/audio/narrate.
  # Seçim ve lisanslar: docs/analiz/sesli-okuma-model-secimi.md. Klasör iki alt klasör taşır: VoxCPM2/ ve
  # aligner/ (ikisi de MANIFEST'te sha256 ile; hizalayıcının kaydı ayrı anahtar). İmaj yerelde kurulur
  # (editorctl install: images/voice/Dockerfile).
  # Ölçüldü 2026-09-26 (H100 NVL, GPU 1, ana model yanında açıkken): açılış 82 sn (torch.compile + ısınma; derleme
  # önbelleği doluyken 41 sn), hazırken 7,6 GiB, üretimde tepe 9,8 GiB (nvidia-smi; PyTorch 9,1 GiB). Pay servis
  # içinde PyTorch tavanıdır (server.py): 0.10 (9,4 GiB) tepeye çok yakındı, 0.12 (11,2 GiB) pay bırakır.
  # RTF 0,34–0,46 (sayfa sesinin süresine göre üretim süresi; derlemesiz 0,59–0,74). Kartta birlikte sığar:
  # ana model 0.70 + 0.12 = 0.82 (2026-10-02'ye dek 0.48); görsel model 0.62 + büyütücü 0.06 + 0.12 = 0.80 (FIT_TOGETHER 0.92).
  # Kitaptan film ve reels (production/film/, kullanıcı kararı 2026-10-04): kareden video (i2v) ve sesten konuşan
  # çekim (s2v) + çekim iyileştirme (/v1/video/enhance). Motorlar (images/video/server.py, 2026-10-07): h3 (MiniMax-H3,
  # varsayılan; VIDEO_ENGINE), fast-h3 / fast-h3-fp8 (FastH3 8-Step V2, FastVideo; yalnız metinden video, hızlı
  # kip), wan2.2 (yedek, Apache-2.0); VIDEO_LICENSED_ENGINES verilirse yalnız listedekiler açık. Kurulumda
  # /data/editor/models altından buraya taşınacak klasörler:
  #   i2v/ ← Wan2.2-I2V-A14B   s2v/ ← Wan2.2-S2V-14B   h3/ ← MiniMax-H3 (FL2VA/Ref2VA yok; fast-h3 ortak parçaları buradan)
  #   fast-h3/ ← FastH3-V2   fast-h3-fp8/ ← FastH3-V2-FP8   enhance/seedvr2/ ← SeedVR2 (7b_sharp_fp16 + ema_vae_fp16)
  #   enhance/rife/ ← RIFE/4.26 (train_log/)   (FastH3 = eski FastVideo-FastH3-Comfy paketi taşınmaz)
  # Ağırlıklar 2026-10-03/04'te indirildi (_indirme/durum.json; RIFE 2026-10-07, RIFE/durum.json), taşınınca MANIFEST'e
  # sha256 ile yazılır. Kart 0'ın neredeyse tamamını ister (0.90; kullanıcı kararı 2026-10-08): çekim sırasında ana model durur,
  # kart 0 videoya verilir (GPU 0'daki ana sohbet modeli qwen38-27b gateway'in dışındadır, çekim başlarken elle
  # durdurulur); görsel denetçi, ses ve görsel model GPU 1'de kalır, çekimle aynı anda çalışabilir. Boşta 5 dk sonra
  # kapanır. ÖLÇÜLMEDİ: açılış süresi, bellek tepesi, çekim başı süre
  # (ilk kurulumda ölçülüp buraya yazılacak). Kullanıcı kararı 2026-10-04: modeller şimdilik ayağa kaldırılmaz.
  # AÇIK (2026-10-08): klasör /data/editor/models/book-video kuruldu (yukarıdaki klasörlerin sabit bağları; asıllar
  # yerinde duruyor), ağırlık MANIFEST'te sha256 ile (anahtar = real_model, revision = dosya listesinin özeti,
  # bileşen revizyonları components altında), editor-video:1 GPU'da derlendi (editorctl install satırı).
  book-video:
    container: editor-model-video
    model_dir: book-video
    real_model: MiniMaxAI/MiniMax-H3+FastVideo/FastVideo-FastH3-8-Step-V2(+FP8)+Wan-AI/Wan2.2-I2V-A14B+Wan2.2-S2V-14B+SeedVR2-7B+RIFE-4.26
    role: Kitaptan film — kareden video, konuşan çekim, çekim iyileştirme
    kind: video
    gpu: 0
    # 0.95 sığmadı: kart 0'da müşterinin baskı tahmin servisi (bi-forecast, gateway dışı) 3,5 GiB tutuyor
    # (2026-10-08: gpu_busy need 90,4 / free 89,6 GiB).
    mem_fraction: 0.90
    idle_stop_sec: 300
    start_timeout_sec: 1800
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VIDEO_ENGINE: h3
    image: editor-video:1
    entrypoint: [python, /srv/server.py]
    args: []

  # Kitaptan çizgi film — müzik (production/film/music.py, kullanıcı kararı 2026-10-07 «en iyi açık kaynak»; kurumun
  # hepsi için lisansı var): sahne başına sözsüz fon müziği (kind: score) ve isteğe bağlı Türkçe sözlü tema şarkısı
  # (kind: song), POST /v1/audio/music (images/music/server.py). Klasör başına bir motor, seçim sırası:
  #   score: stable-audio-3/ (Stable Audio 3.0 Medium; HF kapılı — anahtar /data/editor/secrets/hf-token'a konunca
  #          indirilir) > acestep15/ (ACE-Step 1.5 XL-SFT + LM 4B, MIT) > yue2/ (sözsüz kip)
  #   song:  yue2/ (YuE2-3B + Vae) > minimax-music3/ (MiniMax Music 3) > heartmula/ (HeartMuLa-oss-3B, Apache-2.0)
  # Motor MUSIC_DISABLED_ENGINES env'iyle kapatılır. Lisans koşulları: docs/analiz/film-ve-sosyal-medya-hatti.md
  # «Müzik». Türkçe söz hiçbir motorda belgelenmedi: ilk kurulumda şarkı motorları karşılaştırılır. Motorların
  # kütüphaneleri çakışır: her biri imajda ayrı sanal ortamda, servis tek motoru ayrı süreçte açar, öbürünü kapatır.
  # Ağırlıklar 2026-10-07'den beri indiriliyor (deploy/muzik/, _indirme/muzik-durum.json), kurulumda MANIFEST'e
  # sha256 ile yazılır. Pay 0.40 tahmindir (en büyük: MiniMax tam hassasiyet ~24 GB belgede; ACE-Step XL + LM 4B
  # «≥24 GB tam kalite»; YuE2 tepe 14 GiB; SA3 6,5 GB): ana model 0.70 ile sığmaz, açılışta ana model durur.
  # ÖLÇÜLMEDİ: açılış süresi, bellek tepesi, parça başı süre.
  # AÇIK (2026-10-08): ağırlık MANIFEST'te sha256 ile (anahtar = real_model, revision = dosya listesinin özeti), editor-music:1
  # GPU'da derlendi (editorctl install satırı). stable-audio-3/ henüz yok (HF anahtarı bekleniyor): servis o motoru
  # atlar; indirilince MANIFEST kaydı yeniden yazılmalı. Servis kapalıysa kurgu müziksiz yapılır (music.available → yok).
  book-music:
    container: editor-model-music
    model_dir: book-music
    real_model: stabilityai/stable-audio-3-medium+ACE-Step/acestep-v15-xl-sft+m-a-p/YuE2-3B+MiniMaxAI/MiniMax-Music3+HeartMuLa/HeartMuLa-oss-3B-happy-new-year
    role: Kitaptan film — sahne müziği ve tema şarkısı
    kind: music
    gpu: 1
    mem_fraction: 0.40
    idle_stop_sec: 300
    start_timeout_sec: 900
    image: editor-music:1
    entrypoint: [python, /srv/server.py]
    args: []

  book-voice:
    container: editor-model-voice
    model_dir: book-voice
    real_model: openbmb/VoxCPM2
    role: Sesli okuma (seslendirme + kelime zamanı)
    kind: voice
    gpu: 1
    mem_fraction: 0.12
    idle_stop_sec: 300
    # Derleme önbelleği gateway'in bu takma ada ayırdığı kalıcı klasörde (/root/.cache/vllm → vllm-cache/book-voice):
    # ikinci açılıştan sonra 82 sn yerine 41 sn.
    env:
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/vllm/inductor
