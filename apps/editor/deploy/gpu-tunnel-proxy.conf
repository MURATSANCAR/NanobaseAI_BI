# Host nginx: expose the loopback SSH reverse tunnel only to Editor Docker bridges.
# These addresses belong to this installation; change them for another customer.
server {
    listen 10.203.48.1:18882;
    listen 10.203.62.1:18882;
    server_name _;
    allow 10.203.48.0/24;
    allow 10.203.62.0/24;
    deny all;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:18881;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# On-demand PaddleOCR gateway; status checks must use /gateway/status.
server {
    listen 10.203.48.1:18884;
    listen 10.203.62.1:18884;
    server_name _;
    allow 10.203.48.0/24;
    allow 10.203.62.0/24;
    deny all;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:18883;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
