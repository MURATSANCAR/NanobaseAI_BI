# Apply with the GPU host /data/paddleocr-vl/docker-compose.yml.
# Measured on the shared H100 NVL host; remeasure for other deployments.
# Preserve gateway-managed idle shutdown and restart: no.
services:
  ocr:
    command:
      - PaddlePaddle/PaddleOCR-VL-1.6
      - --served-model-name
      - paddleocr-vl-1.6
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.04"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --enforce-eager
