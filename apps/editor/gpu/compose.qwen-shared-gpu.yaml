# Override for the offline bundle's qwen service on the measured 2 x H100 NVL host.
# OCR reserves a separate 0.04 share on GPU 1. Keep activation headroom too;
# gpu-memory-utilization alone is not a hard process-memory limit.
services:
  qwen:
    command:
      - Qwen/Qwen3.8-Flash-Next-FP8
      - --served-model-name
      - qwen3.8-flash-next
      - --tensor-parallel-size
      - '2'
      - --numa-bind
      - --moe-backend
      - triton
      - --gpu-memory-utilization
      - '0.82'
      - --max-model-len
      - '131072'
      - --max-num-seqs
      - '16'
      - --max-num-batched-tokens
      - '8192'
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --no-enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
