# Qwen3.8-27B-FP8 on the 2 x H100 NVL host: one server, one port, the model
# split across both cards (tensor parallel). Installed as
# /data/qwen27/docker-compose.yml. Replaces /data/qwen38 (Flash-Next); both bind
# port 8001, so only one of them runs at a time.
# OCR reserves a separate 0.04 share on GPU 1. Keep activation headroom too;
# gpu-memory-utilization alone is not a hard process-memory limit.
services:
  qwen:
    image: ${QWEN27_IMAGE:?Set the vLLM image tag present on the host}
    container_name: qwen38-27b
    restart: unless-stopped
    ipc: host
    cap_add:
      - SYS_NICE
    shm_size: 32g
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8001:8000"
    volumes:
      - /data/hf-cache:/root/.cache/huggingface
      - /data/qwen27/vllm-cache:/root/.cache/vllm
    environment:
      HF_HUB_OFFLINE: "1"
      NCCL_P2P_LEVEL: SYS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    command:
      - Qwen/Qwen3.8-27B-FP8
      - --served-model-name
      - nanobaseAI
      - --tensor-parallel-size
      - '2'
      - --numa-bind
      - --gpu-memory-utilization
      - '0.80'
      - --max-model-len
      - '131072'
      - --max-num-seqs
      - '32'
      - --max-num-batched-tokens
      - '8192'
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
