# Private GPU model endpoint. No cloud-provider fallback.
# The base URL is the runner root (without /v1), reachable from this Docker network.
services:
  # GPU profile keeps embedding/reranker, but the old CPU LLM is opt-in only.
  llm:
    profiles: !override [cpu-llm]
  api:
    environment: &gpu-env
      EDITOR_MODEL_BACKEND: vllm
      EDITOR_MODEL_BASE_URL: ${EDITOR_MODEL_BASE_URL:?Set the private GPU URL reachable from Editor containers}
      EDITOR_MODEL_NAME: ${EDITOR_MODEL_NAME:-nanobaseAI}
      EDITOR_MODEL_CONTEXT: ${EDITOR_MODEL_CONTEXT:-32768}
      EDITOR_OCR_VL_BASE_URL: ${EDITOR_OCR_VL_BASE_URL:?Set the on-demand private OCR gateway URL}
      EDITOR_OCR_VL_MODEL: ${EDITOR_OCR_VL_MODEL:-paddleocr-vl-1.6}
      EDITOR_OCR_VL_REVISION: ${EDITOR_OCR_VL_REVISION:?Set the deployed OCR model revision}
  worker:
    environment: *gpu-env
