# ZEKİ AI yapay zekâ paneli → LLM kapısı (köprünün OpenAI uyumlu girişi).
# portal.nanobase.ai server bloğuna, gpu-llm snippet'inin yanına include edilir:
#   sudo cp apps/destek/deploy/nginx-destek-llm.conf /etc/nginx/snippets/destek-llm.conf
#   (anahtar satırı kurulumda /etc/nanobase/destek-llm.key'den yazılır; depoda yer tutucu)
# Koruma: 256-bit Bearer anahtarı (TLS). Köprünün çağıran jetonu nginx'te eklenir.
location ^~ /destek-llm/v1/ {
    allow all;
    if ($http_authorization != "Bearer __DESTEK_LLM_KEY__") { return 401; }
    include /etc/nginx/snippets/timas-semantic-caller.conf;
    proxy_set_header Authorization "";
    proxy_set_header X-LLM-Module "destek";
    proxy_pass http://127.0.0.1:8795/api/v1/llm/openai/v1/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 32m;
    access_log /var/log/nginx/destek-llm.access.log;
}
