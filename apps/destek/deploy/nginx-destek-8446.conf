# NanobaseAI Destek — portal sertifikasıyla ayrı port (çatı kök yolda çalışır,
# /timas/ altına alınamaz: /app, /api, /assets, /helpdesk yolları kökten gelir).
#
# Kurulum (test sunucusu):
#   sudo cp apps/destek/deploy/nginx-destek-8446.conf /etc/nginx/sites-available/destek-8446.conf
#   sudo ln -sf /etc/nginx/sites-available/destek-8446.conf /etc/nginx/sites-enabled/
#   sudo ufw allow 8446/tcp comment 'nanobase-destek'
#   sudo nginx -t && sudo systemctl reload nginx
# Arka uç: compose frontend servisi 127.0.0.1:8447.

# Giriş uçları dışarıya açık ve AD şifresini doğrular: IP başına dakikada 10 istek (portal girişindeki gibi).
limit_req_zone $binary_remote_addr zone=destek_login:10m rate=10r/m;

upstream nanobase_destek {
    server 127.0.0.1:8447;
    keepalive 16;
}

server {
    listen 8446 ssl http2;
    server_name portal.nanobase.ai;

    ssl_certificate /etc/letsencrypt/live/portal.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.nanobase.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    access_log /var/log/nginx/destek.access.log;

    location = / {
        return 302 /helpdesk;
    }

    # Şifre alan giriş uçları: hız sınırı
    location ~ ^/api/method/(login|frappe\.integrations\.doctype\.ldap_settings\.ldap_settings\.login)$ {
        limit_req zone=destek_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://nanobase_destek;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8446;
    }

    # Tek oturum dönüşü: 60 sn'lik tek kullanımlık jeton adreste taşınır; günlüğe yazılmaz.
    location = /api/method/nanobase_brand.sso.login {
        access_log off;
        limit_req zone=destek_login burst=10 nodelay;
        proxy_pass http://nanobase_destek;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8446;
    }

    location / {
        proxy_pass http://nanobase_destek;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8446;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Yapay zekâ panelinin akışlı yanıtı tamponlanmaz.
        proxy_buffering off;
    }
}
