# Microsoft SQL Server (T-SQL) function policy — read-only analytics surface.
allowed:
  - COUNT
  - COUNT_BIG
  - SUM
  - AVG
  - MIN
  - MAX
  - ROUND
  - CEILING
  - FLOOR
  - ABS
  - COALESCE
  - ISNULL
  - NULLIF
  - IIF
  - CAST
  - CONVERT
  - TRY_CAST
  - TRY_CONVERT
  - GETDATE
  - SYSDATETIME
  - DATEADD
  - DATEDIFF
  - DATEPART
  - DATENAME
  - DATEFROMPARTS
  - EOMONTH
  - YEAR
  - MONTH
  - DAY
  - FORMAT
  - UPPER
  - LOWER
  - LTRIM
  - RTRIM
  - TRIM
  - LEN
  - LEFT
  - RIGHT
  - SUBSTRING
  - REPLACE
  - CONCAT
  - CHARINDEX
  - STRING_AGG
  - ROW_NUMBER
  - RANK
  - DENSE_RANK
  - NTILE
  - LAG
  - LEAD
  - FIRST_VALUE
  - LAST_VALUE
  - STDEV
  - VAR
  - SQRT
  - POWER
  - LOG
  - EXP
  - SIGN
  - PERCENTILE_CONT
  - PERCENTILE_DISC
  - CHECKSUM
  - HASHBYTES
  - TOP
controlled:
  - OPENQUERY
  - OPENROWSET
  - STRING_SPLIT
denied:
