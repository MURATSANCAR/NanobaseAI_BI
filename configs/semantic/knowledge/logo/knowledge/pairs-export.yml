- nl: 2026 yılında KITAPCI, E-TICARET ve DAGITICI kanalları için ay bazında net ciro
    (satış eksi iade) ve her kanalın o ay içindeki payını yüzde olarak ver; ay ve
    kanal sırasıyla listele.
  sql: "SELECT \n    DATEFROMPARTS(YEAR(i.\"DATE_\"), MONTH(i.\"DATE_\"), 1) AS ay,\n\
    \    COALESCE(NULLIF(c.\"SPECODE2\", ''), '(boş)') AS kanal,\n    SUM(CASE WHEN\
    \ i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\" ELSE -i.\"NETTOTAL\" END) AS net_ciro,\n\
    \    SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\" ELSE -i.\"NETTOTAL\"\
    \ END) * 100.0 / NULLIF(SUM(SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\"\
    \ ELSE -i.\"NETTOTAL\" END)) OVER (PARTITION BY DATEFROMPARTS(YEAR(i.\"DATE_\"\
    ), MONTH(i.\"DATE_\"), 1)), 0) AS kanal_payi_yuzde\nFROM dbo_LG_411_01_INVOICE\
    \ i\nJOIN dbo_LG_411_CLCARD c ON c.\"LOGICALREF\" = i.\"CLIENTREF\"\nWHERE i.\"\
    CANCELLED\" = 0\n  AND i.\"TRCODE\" IN (2,3,7,8,9)\n  AND i.\"DATE_\" >= '2026-01-01'\n\
    \  AND i.\"DATE_\" < '2027-01-01'\n  AND c.\"SPECODE2\" IN ('KITAPCI', 'E-TICARET',\
    \ 'DAGITICI')\nGROUP BY \n    DATEFROMPARTS(YEAR(i.\"DATE_\"), MONTH(i.\"DATE_\"\
    ), 1),\n    COALESCE(NULLIF(c.\"SPECODE2\", ''), '(boş)')\nORDER BY \n    ay,\n\
    \    kanal"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 2026'da mal alım (TRCODE 1) ve alınan hizmet (TRCODE 4) faturalarında tedarikçi
    (cari) bazında toplam tutar, fatura sayısı, ilk ve son fatura tarihi; toplam tutara
    göre ilk 10 tedarikçi, cari unvanıyla.
  sql: "SELECT TOP 10\n    \"CLCARD\".\"DEFINITION_\" AS \"CARI_UNVANI\",\n    SUM(\"\
    INVOICE\".\"NETTOTAL\") AS \"TOPLAM_TUTAR\",\n    COUNT(\"INVOICE\".\"LOGICALREF\"\
    ) AS \"FATURA_SAYISI\",\n    MIN(\"INVOICE\".\"DATE_\") AS \"ILK_FATURA_TARIHI\"\
    ,\n    MAX(\"INVOICE\".\"DATE_\") AS \"SON_FATURA_TARIHI\"\nFROM \"dbo_LG_411_01_INVOICE\"\
    \ AS \"INVOICE\"\nINNER JOIN \"dbo_LG_411_CLCARD\" AS \"CLCARD\"\n    ON \"INVOICE\"\
    .\"CLIENTREF\" = \"CLCARD\".\"LOGICALREF\"\nWHERE \"INVOICE\".\"CANCELLED\" =\
    \ 0\n    AND \"INVOICE\".\"TRCODE\" IN (1, 4)\n    AND \"INVOICE\".\"DATE_\" >=\
    \ '2026-01-01'\n    AND \"INVOICE\".\"DATE_\" < '2027-01-01'\nGROUP BY \"CLCARD\"\
    .\"DEFINITION_\"\nORDER BY SUM(\"INVOICE\".\"NETTOTAL\") DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: Yayınevi bazında 2026 YTD net ciro (satış satırları eksi iade satırları), satılan
    adet, iade adedi, adet bazlı iade oranı ve maliyetli satırlardan brüt kâr marjı;
    yalnız net cirosu 20 milyon TL üzerindeki yayınevleri, marja göre azalan sırada.
  sql: "SELECT \n    COALESCE(NULLIF(it.\"SPECODE\", ''), '(boş)') AS yayinevi,\n\
    \    SUM(CASE WHEN sl.\"TRCODE\" IN (7,8) THEN sl.\"TOTAL\" ELSE -sl.\"TOTAL\"\
    \ END) AS net_ciro,\n    SUM(CASE WHEN sl.\"TRCODE\" IN (7,8) THEN sl.\"AMOUNT\"\
    \ ELSE 0 END) AS satilan_adet,\n    SUM(CASE WHEN sl.\"TRCODE\" IN (2,3) THEN\
    \ sl.\"AMOUNT\" ELSE 0 END) AS iade_adedi,\n    SUM(CASE WHEN sl.\"TRCODE\" IN\
    \ (2,3) THEN sl.\"AMOUNT\" ELSE 0 END) / NULLIF(SUM(CASE WHEN sl.\"TRCODE\" IN\
    \ (7,8) THEN sl.\"AMOUNT\" ELSE 0 END), 0) AS adet_iade_orani,\n    1 - SUM(CASE\
    \ WHEN sl.\"TRCODE\" IN (7,8) AND sl.\"OUTCOST\" <> 0 THEN sl.\"AMOUNT\" * sl.\"\
    OUTCOST\" ELSE 0 END) / NULLIF(SUM(CASE WHEN sl.\"TRCODE\" IN (7,8) AND sl.\"\
    OUTCOST\" <> 0 THEN sl.\"TOTAL\" ELSE 0 END), 0) AS brut_kar_marji\nFROM dbo_LG_411_01_STLINE\
    \ sl\nJOIN dbo_LG_411_ITEMS it ON it.\"LOGICALREF\" = sl.\"STOCKREF\"\nWHERE sl.\"\
    CANCELLED\" = 0 \n  AND sl.\"LINETYPE\" = 0 \n  AND sl.\"TRCODE\" IN (2,3,7,8)\n\
    \  AND sl.\"DATE_\" >= '2026-01-01' \n  AND sl.\"DATE_\" < '2027-01-01'\nGROUP\
    \ BY COALESCE(NULLIF(it.\"SPECODE\", ''), '(boş)')\nHAVING SUM(CASE WHEN sl.\"\
    TRCODE\" IN (7,8) THEN sl.\"TOTAL\" ELSE -sl.\"TOTAL\" END) > 20000000\nORDER\
    \ BY brut_kar_marji DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: En çok iade alan 10 müşteri kimler?
  sql: 'SELECT c."CODE" AS cari_kodu, c."DEFINITION_" AS unvan, SUM(i."NETTOTAL")
    AS iade_tutari, COUNT(*) AS iade_faturasi FROM dbo_LG_411_01_INVOICE i JOIN dbo_LG_411_CLCARD
    c ON c."LOGICALREF" = i."CLIENTREF" WHERE i."CANCELLED" = 0 AND i."TRCODE" IN
    (2,3) GROUP BY c."CODE", c."DEFINITION_" ORDER BY iade_tutari DESC LIMIT 10

    '
