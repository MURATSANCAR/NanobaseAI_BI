- nl: En çok satan 10 kitap hangileri (adet)?
  sql: 'SELECT it."CODE" AS stok_kodu, it."NAME" AS kitap, SUM(sl."AMOUNT") AS adet,
    SUM(sl."TOTAL") AS tutar FROM dbo_LG_411_01_STLINE sl JOIN dbo_LG_411_ITEMS it
    ON it."LOGICALREF" = sl."STOCKREF" WHERE sl."CANCELLED" = 0 AND sl."LINETYPE"
    = 0 AND sl."TRCODE" IN (7,8) GROUP BY it."CODE", it."NAME" ORDER BY adet DESC
    LIMIT 10

    '
  source: legacy-wren-ui
  datasource: logo-tunnel
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 2026 iskonto oranı nedir?
  sql: 'SELECT SUM(CASE WHEN "LINETYPE" = 0 THEN "TOTAL" ELSE 0 END) AS brut, SUM(CASE
    WHEN "LINETYPE" = 2 THEN "TOTAL" ELSE 0 END) AS iskonto, SUM(CASE WHEN "LINETYPE"
    = 2 THEN "TOTAL" ELSE 0 END) / NULLIF(SUM(CASE WHEN "LINETYPE" = 0 THEN "TOTAL"
    ELSE 0 END), 0) AS iskonto_orani FROM dbo_LG_411_01_STLINE WHERE "CANCELLED" =
    0 AND "TRCODE" IN (7,8) AND "DATE_" >= ''2026-01-01''

    '
  source: legacy-wren-ui
  datasource: logo-tunnel
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 2026 ay bazında açılan sipariş sayısı ve toplam sipariş tutarı (sipariş fişleri)
  sql: "SELECT DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"DATE_\"), 1) AS ay,\n      \
    \ COUNT(DISTINCT \"LOGICALREF\") AS siparis_sayisi,\n       SUM(\"NETTOTAL\")\
    \ AS toplam_tutar\nFROM dbo_LG_411_01_ORFICHE\nWHERE \"CANCELLED\" = 0 AND \"\
    DATE_\" >= '2026-01-01' AND \"DATE_\" < '2027-01-01'\nGROUP BY DATEFROMPARTS(YEAR(\"\
    DATE_\"), MONTH(\"DATE_\"), 1)\nORDER BY ay\n"
  source: verified-2026-09-06
  datasource: logo-tunnel
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 2026 Ocak–Ağustos için ay bazında iskonto oranı ve satış faturası başına ortalama
    fatura tutarı
  sql: "WITH iskonto AS (\n  SELECT DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"DATE_\"\
    ), 1) AS ay,\n         SUM(CASE WHEN \"LINETYPE\" = 2 THEN \"TOTAL\" ELSE 0 END)\
    \ / NULLIF(SUM(CASE WHEN \"LINETYPE\" = 0 THEN \"TOTAL\" ELSE 0 END), 0) AS iskonto_orani\n\
    \  FROM dbo_LG_411_01_STLINE WHERE \"CANCELLED\" = 0 AND \"TRCODE\" IN (7,8) AND\
    \ \"DATE_\" >= '2026-01-01' AND \"DATE_\" < '2026-09-01'\n  GROUP BY DATEFROMPARTS(YEAR(\"\
    DATE_\"), MONTH(\"DATE_\"), 1)\n), fatura AS (\n  SELECT DATEFROMPARTS(YEAR(\"\
    DATE_\"), MONTH(\"DATE_\"), 1) AS ay, AVG(\"NETTOTAL\") AS ortalama_fatura_tutari,\
    \ COUNT(*) AS fatura_sayisi\n  FROM dbo_LG_411_01_INVOICE WHERE \"CANCELLED\"\
    \ = 0 AND \"TRCODE\" IN (7,8,9) AND \"DATE_\" >= '2026-01-01' AND \"DATE_\" <\
    \ '2026-09-01'\n  GROUP BY DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"DATE_\"), 1)\n\
    )\nSELECT i.ay, i.iskonto_orani, f.ortalama_fatura_tutari, f.fatura_sayisi\nFROM\
    \ iskonto i JOIN fatura f ON f.ay = i.ay ORDER BY i.ay\n"
  source: verified-2026-09-06
  datasource: logo-tunnel
  created_at: '2026-09-06T06:14:11.121971+00:00'
