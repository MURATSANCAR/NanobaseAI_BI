- nl: 2026 yılında aylık net satış tutarı nedir?
  sql: 'SELECT SUM(CASE WHEN "DATE_" >= ''2026-01-01'' AND "DATE_" < ''2026-02-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-01-01'' AND "DATE_" < ''2026-02-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_01, SUM(CASE WHEN "DATE_" >= ''2026-02-01'' AND "DATE_" < ''2026-03-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-02-01'' AND "DATE_" < ''2026-03-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_02, SUM(CASE WHEN "DATE_" >= ''2026-03-01'' AND "DATE_" < ''2026-04-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-03-01'' AND "DATE_" < ''2026-04-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_03, SUM(CASE WHEN "DATE_" >= ''2026-04-01'' AND "DATE_" < ''2026-05-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-04-01'' AND "DATE_" < ''2026-05-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_04, SUM(CASE WHEN "DATE_" >= ''2026-05-01'' AND "DATE_" < ''2026-06-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-05-01'' AND "DATE_" < ''2026-06-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_05, SUM(CASE WHEN "DATE_" >= ''2026-06-01'' AND "DATE_" < ''2026-07-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-06-01'' AND "DATE_" < ''2026-07-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_06, SUM(CASE WHEN "DATE_" >= ''2026-07-01'' AND "DATE_" < ''2026-08-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-07-01'' AND "DATE_" < ''2026-08-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_07, SUM(CASE WHEN "DATE_" >= ''2026-08-01'' AND "DATE_" < ''2026-09-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-08-01'' AND "DATE_" < ''2026-09-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_08, SUM(CASE WHEN "DATE_" >= ''2026-09-01'' AND "DATE_" < ''2026-10-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-09-01'' AND "DATE_" < ''2026-10-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_09, SUM(CASE WHEN "DATE_" >= ''2026-10-01'' AND "DATE_" < ''2026-11-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-10-01'' AND "DATE_" < ''2026-11-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_10, SUM(CASE WHEN "DATE_" >= ''2026-11-01'' AND "DATE_" < ''2026-12-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-11-01'' AND "DATE_" < ''2026-12-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_11, SUM(CASE WHEN "DATE_" >= ''2026-12-01'' AND "DATE_" < ''2027-01-01''
    AND "TRCODE" IN (7,8,9) THEN "NETTOTAL" ELSE 0 END) - SUM(CASE WHEN "DATE_" >=
    ''2026-12-01'' AND "DATE_" < ''2027-01-01'' AND "TRCODE" IN (2,3) THEN "NETTOTAL"
    ELSE 0 END) AS ay_12 FROM dbo_LG_411_01_INVOICE WHERE "CANCELLED" = 0 AND "TRCODE"
    IN (2,3,7,8,9)

    '
