- nl: 'Temmuz 2026''da en çok satan 15 kitap: stok kodu, kitap adı, yayınevi, satılan
    adet ve brüt satır tutarı; yalnız toptan satış faturaları (TRCODE 8), adede göre
    azalan.'
  sql: "SELECT TOP 15\n    it.\"CODE\" AS stok_kodu,\n    it.\"NAME\" AS kitap_adi,\n\
    \    COALESCE(NULLIF(it.\"SPECODE\", ''), '(boş)') AS yayinevi,\n    SUM(sl.\"\
    AMOUNT\") AS satilan_adet,\n    SUM(sl.\"TOTAL\") AS brut_satir_tutari\nFROM dbo_LG_411_01_STLINE\
    \ sl\nJOIN dbo_LG_411_ITEMS it ON it.\"LOGICALREF\" = sl.\"STOCKREF\"\nWHERE sl.\"\
    CANCELLED\" = 0\n  AND sl.\"LINETYPE\" = 0\n  AND sl.\"TRCODE\" = 8\n  AND sl.\"\
    DATE_\" >= '2026-07-01'\n  AND sl.\"DATE_\" < '2026-08-01'\nGROUP BY it.\"CODE\"\
    , it.\"NAME\", COALESCE(NULLIF(it.\"SPECODE\", ''), '(boş)')\nORDER BY SUM(sl.\"\
    AMOUNT\") DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 'En çok iade alan 10 müşteri: iade tutarı, aynı müşterinin 2026 satış tutarı,
    iade/satış oranı ve cari kartındaki kanal kodu; yalnız satışı 1 milyon TL üzerinde
    olanlar, iade tutarına göre azalan.'
  sql: "SELECT TOP 10\n    c.\"CODE\" AS cari_kodu,\n    c.\"DEFINITION_\" AS unvan,\n\
    \    ISNULL(c.\"SPECODE2\", '(boş)') AS satis_kanali,\n    SUM(CASE WHEN i.\"\
    TRCODE\" IN (2,3) THEN i.\"NETTOTAL\" ELSE 0 END) AS iade_tutari,\n    SUM(CASE\
    \ WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\" ELSE 0 END) AS satis_tutari,\n\
    \    CASE \n        WHEN SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\"\
    \ ELSE 0 END) = 0 THEN 0\n        ELSE SUM(CASE WHEN i.\"TRCODE\" IN (2,3) THEN\
    \ i.\"NETTOTAL\" ELSE 0 END) / SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"\
    NETTOTAL\" ELSE 0 END)\n    END AS iade_satis_orani\nFROM dbo_LG_411_01_INVOICE\
    \ i\nJOIN dbo_LG_411_CLCARD c ON c.\"LOGICALREF\" = i.\"CLIENTREF\"\nWHERE i.\"\
    CANCELLED\" = 0\n  AND i.\"TRCODE\" IN (2,3,7,8,9)\n  AND i.\"DATE_\" >= '2026-01-01'\n\
    \  AND i.\"DATE_\" < '2027-01-01'\nGROUP BY c.\"CODE\", c.\"DEFINITION_\", ISNULL(c.\"\
    SPECODE2\", '(boş)')\nHAVING SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN i.\"NETTOTAL\"\
    \ ELSE 0 END) > 1000000\nORDER BY iade_tutari DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 'Perakende (TRCODE 7) ile toptan (TRCODE 8) satışları 2026 ay bazında karşılaştır:
    her ay için fatura sayısı, NETTOTAL toplamı ve ortalama fatura tutarı; ayrıca
    perakendenin o ayın toplam satışındaki payı.'
  sql: "SELECT \n    DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"DATE_\"), 1) AS ay,\n\
    \    SUM(CASE WHEN \"TRCODE\" = 7 THEN 1 ELSE 0 END) AS perakende_fatura_sayisi,\n\
    \    SUM(CASE WHEN \"TRCODE\" = 7 THEN \"NETTOTAL\" ELSE 0 END) AS perakende_toplam,\n\
    \    SUM(CASE WHEN \"TRCODE\" = 7 THEN \"NETTOTAL\" ELSE 0 END) / NULLIF(SUM(CASE\
    \ WHEN \"TRCODE\" = 7 THEN 1 ELSE 0 END), 0) AS perakende_ortalama,\n    SUM(CASE\
    \ WHEN \"TRCODE\" = 8 THEN 1 ELSE 0 END) AS toptan_fatura_sayisi,\n    SUM(CASE\
    \ WHEN \"TRCODE\" = 8 THEN \"NETTOTAL\" ELSE 0 END) AS toptan_toplam,\n    SUM(CASE\
    \ WHEN \"TRCODE\" = 8 THEN \"NETTOTAL\" ELSE 0 END) / NULLIF(SUM(CASE WHEN \"\
    TRCODE\" = 8 THEN 1 ELSE 0 END), 0) AS toptan_ortalama,\n    SUM(CASE WHEN \"\
    TRCODE\" = 7 THEN \"NETTOTAL\" ELSE 0 END) / NULLIF(SUM(CASE WHEN \"TRCODE\" IN\
    \ (7,8) THEN \"NETTOTAL\" ELSE 0 END), 0) AS perakende_payi\nFROM dbo_LG_411_01_INVOICE\n\
    WHERE \"CANCELLED\" = 0\n  AND \"TRCODE\" IN (7, 8)\n  AND \"DATE_\" >= '2026-01-01'\n\
    \  AND \"DATE_\" < '2027-01-01'\nGROUP BY DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"\
    DATE_\"), 1)\nORDER BY 1"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 'Müşteri yoğunlaşması: 2026 net ciroya (satış eksi iade) göre ilk 10 müşterinin
    toplam net ciro içindeki payı yüzde olarak; her müşteri için net ciro, kümülatif
    pay ve kanal kodu.'
  sql: "WITH customer_net AS (\n    SELECT \n        c.\"CODE\" AS cari_kodu,\n  \
    \      c.\"DEFINITION_\" AS unvan,\n        COALESCE(NULLIF(c.\"SPECODE2\", ''),\
    \ '(boş)') AS kanal_kodu,\n        SUM(CASE WHEN i.\"TRCODE\" IN (7,8,9) THEN\
    \ i.\"NETTOTAL\" ELSE -i.\"NETTOTAL\" END) AS net_ciro\n    FROM dbo_LG_411_01_INVOICE\
    \ i\n    JOIN dbo_LG_411_CLCARD c ON c.\"LOGICALREF\" = i.\"CLIENTREF\"\n    WHERE\
    \ i.\"CANCELLED\" = 0\n      AND i.\"TRCODE\" IN (2,3,7,8,9)\n      AND i.\"DATE_\"\
    \ >= '2026-01-01'\n      AND i.\"DATE_\" < '2027-01-01'\n    GROUP BY c.\"CODE\"\
    , c.\"DEFINITION_\", COALESCE(NULLIF(c.\"SPECODE2\", ''), '(boş)')\n),\nranked\
    \ AS (\n    SELECT \n        cari_kodu,\n        unvan,\n        kanal_kodu,\n\
    \        net_ciro,\n        SUM(net_ciro) OVER (ORDER BY net_ciro DESC ROWS BETWEEN\
    \ UNBOUNDED PRECEDING AND CURRENT ROW) AS kumulatif_ciro,\n        SUM(net_ciro)\
    \ OVER () AS toplam_net_ciro\n    FROM customer_net\n)\nSELECT TOP 10\n    cari_kodu,\n\
    \    unvan,\n    kanal_kodu,\n    net_ciro,\n    (net_ciro / NULLIF(toplam_net_ciro,\
    \ 0)) * 100 AS pay_yuzde,\n    (kumulatif_ciro / NULLIF(toplam_net_ciro, 0)) *\
    \ 100 AS kumulatif_pay_yuzde\nFROM ranked\nORDER BY net_ciro DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: Kanal bazında net ciro nedir?
  sql: 'SELECT COALESCE(NULLIF(c."SPECODE2", ''''), ''(boş)'') AS kanal, SUM(CASE
    WHEN i."TRCODE" IN (7,8,9) THEN i."NETTOTAL" ELSE -i."NETTOTAL" END) AS net_ciro,
    COUNT(DISTINCT i."CLIENTREF") AS cari_sayisi FROM dbo_LG_411_01_INVOICE i JOIN
    dbo_LG_411_CLCARD c ON c."LOGICALREF" = i."CLIENTREF" WHERE i."CANCELLED" = 0
    AND i."TRCODE" IN (2,3,7,8,9) GROUP BY 1 ORDER BY net_ciro DESC

    '
  source: legacy-wren-ui
  datasource: logo-tunnel
  created_at: '2026-09-06T06:14:11.121971+00:00'
- nl: 'Kanal bazında brüt kâr marjı: satış hareket satırlarında (TRCODE 7,8, LINETYPE
    0, maliyeti işlenmiş satırlar) faturanın cari kartındaki kanal koduna göre maliyetli
    ciro, maliyet ve marj yüzdesi; maliyetli cirosu 10 milyon TL üzerindeki kanallar,
    marja göre azalan.'
  sql: "SELECT \n    COALESCE(NULLIF(c.\"SPECODE2\", ''), '(boş)') AS kanal,\n   \
    \ SUM(s.\"TOTAL\") AS maliyetli_ciro,\n    SUM(s.\"AMOUNT\" * s.\"OUTCOST\") AS\
    \ toplam_maliyet,\n    (1 - SUM(s.\"AMOUNT\" * s.\"OUTCOST\") / NULLIF(SUM(s.\"\
    TOTAL\"), 0)) * 100 AS brut_kar_marji_yuzde\nFROM dbo_LG_411_01_STLINE s\nJOIN\
    \ dbo_LG_411_01_INVOICE i ON i.\"LOGICALREF\" = s.\"INVOICEREF\"\nJOIN dbo_LG_411_CLCARD\
    \ c ON c.\"LOGICALREF\" = i.\"CLIENTREF\"\nWHERE s.\"CANCELLED\" = 0\n  AND s.\"\
    LINETYPE\" = 0\n  AND s.\"OUTCOST\" <> 0\n  AND i.\"CANCELLED\" = 0\n  AND i.\"\
    TRCODE\" IN (7, 8)\nGROUP BY COALESCE(NULLIF(c.\"SPECODE2\", ''), '(boş)')\nHAVING\
    \ SUM(s.\"TOTAL\") > 10000000\nORDER BY brut_kar_marji_yuzde DESC"
  source: user
  created_at: '2026-09-06T06:14:11.121971+00:00'
