  - name: "is_sale"
    type: "BOOLEAN"
    is_calculated: true
    expression: "CASE WHEN \"TRCODE\" IN (7,8,9) THEN 1 ELSE 0 END"
    properties:
      "description": "Satış faturası mı (TRCODE 7,8,9)"
  - name: "is_sales_return"
    type: "BOOLEAN"
    is_calculated: true
    expression: "CASE WHEN \"TRCODE\" IN (2,3) THEN 1 ELSE 0 END"
    properties:
      "description": "Satış iadesi mi (TRCODE 2,3)"
  - name: "is_purchase"
    type: "BOOLEAN"
    is_calculated: true
    expression: "CASE WHEN \"TRCODE\" IN (1,4) THEN 1 ELSE 0 END"
    properties:
      "description": "Mal alım / alınan hizmet mi (TRCODE 1,4)"
  - name: "net_signed_total"
    type: "DOUBLE"
    is_calculated: true
    expression: "CASE WHEN \"TRCODE\" IN (7,8,9) THEN \"NETTOTAL\" WHEN \"TRCODE\" IN (2,3) THEN -\"NETTOTAL\" ELSE 0 END"
    properties:
      "description": "Net ciroya katkı: satış +NETTOTAL, satış iadesi −NETTOTAL, diğer 0"
  - name: "invoice_month"
    type: "DATE"
    is_calculated: true
    expression: "DATEFROMPARTS(YEAR(\"DATE_\"), MONTH(\"DATE_\"), 1)"
