name: "dbo_LG_411_01_INVOICE"
table_reference:
  catalog: "LOGO_DB"
  schema: "dbo"
  table: "LG_411_01_INVOICE"
primary_key: "LOGICALREF"
properties:
  "description": "Fatura başlığı (2026, firma 411). TRCODE: 1 mal alım, 2 perakende satış iadesi, 3 toptan satış iadesi, 4 alınan hizmet, 6 alım iadesi, 7 perakende satış, 8 toptan satış, 9 verilen hizmet. Tutar NETTOTAL (KDV dahil net), tarih DATE_, cari CLIENTREF → dbo_LG_411_CLCARD. Daima CANCELLED = 0."
  "displayName": "dbo.LG_411_01_INVOICE"
columns:
  - name: "BRANCH"
    type: "SMALLINT"
    properties:
      "description": "[enum] 1 · 1 farklı değer"
      "displayName": "BRANCH"
  - name: "CANCELLED"
    type: "SMALLINT"
    properties:
      "description": "İptal bayrağı; daima CANCELLED = 0 [enum] 0=geçerli belge, 1=iptal · 2 farklı değer [pii] telefon/faks — kişisel veri, asla seçme/maskele"
      "displayName": "CANCELLED"
  - name: "CLIENTREF"
    type: "INTEGER"
    properties:
      "description": "Cari kart referansı → dbo_LG_411_CLCARD.LOGICALREF"
      "displayName": "CLIENTREF"
  - name: "DATE_"
    type: "TIMESTAMP"
    properties:
      "description": "Fatura tarihi (2026) belge (fatura) tarihi [time] gün hassasiyeti (saat 00:00), yerel saat, TZ yok; ay/yıl kırılımı bu kolondan; mali yıl = takvim yılı (firma 411 = 2026)"
      "displayName": "DATE_"
  - name: "DOCDATE"
    type: "TIMESTAMP"
    properties:
      "description": "Kaynak evrak tarihi; raporlama DATE_ ile [time] gün hassasiyeti, TZ yok"
      "displayName": "DOCDATE"
  - name: "EINVOICE"
    type: "SMALLINT"
    properties:
      "description": "[enum] 2, 1, 0 · 3 farklı değer"
      "displayName": "EINVOICE"
  - name: "FICHENO"
    type: "VARCHAR"
    properties:
      "description": "Fatura numarası"
      "displayName": "FICHENO"
  - name: "GROSSTOTAL"
    type: "FLOAT8"
    properties:
      "description": "Fatura brüt toplamı (iskonto öncesi) [unit] TL, iskonto öncesi brüt"
      "displayName": "GROSSTOTAL"
  - name: "LOGICALREF"
    type: "INTEGER"
    not_null: true
    is_primary_key: true
    properties:
      "description": "Birincil anahtar"
      "displayName": "LOGICALREF"
  - name: "NETTOTAL"
    type: "FLOAT8"
    properties:
      "description": "Fatura net toplamı (KDV dahil); ciro/satış/iade/alım tutarı bu kolondan [unit] TL (yerel para), KDV dahil; döviz belgelerinde TL karşılığı"
      "displayName": "NETTOTAL"
  - name: "PAYDEFREF"
    type: "INTEGER"
    properties:
      "displayName": "PAYDEFREF"
  - name: "SALESMANREF"
    type: "INTEGER"
    properties:
      "description": "Satış temsilcisi referansı; ≈%83–88 dolu [magic] 0 = atanmamış (Logo *REF kolonlarında boş değer 0'dır, NULL değil)"
      "displayName": "SALESMANREF"
  - name: "TOTALDISCOUNTS"
    type: "FLOAT8"
    properties:
      "description": "Fatura toplam iskontosu [unit] TL"
      "displayName": "TOTALDISCOUNTS"
  - name: "TOTALVAT"
    type: "FLOAT8"
    properties:
      "description": "Fatura toplam KDV [unit] TL; KDV hariç net = NETTOTAL − TOTALVAT"
      "displayName": "TOTALVAT"
  - name: "TRCODE"
    type: "SMALLINT"
    properties:
      "description": "Fatura türü: 1 mal alım, 2 perakende satış iadesi, 3 toptan satış iadesi, 4 alınan hizmet, 6 alım iadesi, 7 perakende satış, 8 toptan satış, 9 verilen hizmet [enum] 7=perakende satış, 8=toptan satış, 4=alınan hizmet, 3=toptan satış iadesi, 1=mal alım, 2=perakende satış iadesi, 9=verilen hizmet, 6=alım iadesi · 8 farklı değer"
      "displayName": "TRCODE"
  - name: "TRCURR"
    type: "SMALLINT"
    properties:
