# Explicit Logo business-date equivalence confirmed during the live regression review.
# A generic FK is not date equivalence: do not broaden this to order/due/customer dates.
equivalent_dates:
  - left:
      entity: INVOICE
      column: DATE_
    right:
      entity: STLINE
      column: DATE_
    join: [STLINE, INVOICEREF, INVOICE, LOGICALREF]
    reason: "Fatura başlığı ve ona bağlı satış satırı aynı işlem dönemini taşır."

# The existing Logo return report uses invoice TRCODE 2/3; the catalog's "iade"
# binding currently lives on STLINE. Restrict equivalence to these exact codes.
# Source: knowledge/sql/en-cok-iade-alan-10-musteri-kimler.md and the live review.
equivalent_filters:
  - left:
      entity: STLINE
      column: TRCODE
    right:
      entity: INVOICE
      column: TRCODE
    operator: IN
    values: ["2", "3"]
    join: [STLINE, INVOICEREF, INVOICE, LOGICALREF]
    reason: "Satış iadesi kodları 2 ve 3, fatura başlığı ve bağlı satış satırında aynı işlemi seçer."

# A sale occurrence uses the certified invoice sales scope (7,8,9), not net
# balance: a later return does not erase the fact that the product was sold.
absence_queries:
  - verb_root: sat
    subject: ITEMS
    event: STLINE
    scope_entity: INVOICE
    date_column: DATE_
    joins:
      - [STLINE, STOCKREF, ITEMS, LOGICALREF]
      - [STLINE, INVOICEREF, INVOICE, LOGICALREF]
    columns:
      ITEMS: [LOGICALREF, CODE, NAME]
      STLINE: [STOCKREF, INVOICEREF, CANCELLED, LINETYPE]
      INVOICE: [LOGICALREF, DATE_, TRCODE, CANCELLED]
    predicates:
      - {entity: STLINE, column: CANCELLED, operator: '=', values: ['0']}
      - {entity: STLINE, column: LINETYPE, operator: '=', values: ['0']}
      - {entity: INVOICE, column: TRCODE, operator: IN, values: ['7', '8', '9']}
      - {entity: INVOICE, column: CANCELLED, operator: '=', values: ['0']}
    reason: "İptal edilmemiş satış faturalarına (sertifikalı satış kapsamı 7,8,9) bağlı ürün satırının yokluğu; iade satışın gerçekleşmiş olmasını silmez."
