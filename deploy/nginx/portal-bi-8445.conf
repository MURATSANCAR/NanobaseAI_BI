# Temporary BI FE until bi.nanobase.ai DNS+cert are ready.
# https://portal.nanobase.ai:8445 → /data/nanobaseai/bi/portal/dist
# API → runner :8787

upstream bi_fe_runner_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 8445 ssl http2;
    server_name portal.nanobase.ai;

    ssl_certificate /etc/letsencrypt/live/portal.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.nanobase.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    root /data/nanobaseai/bi/portal/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://bi_fe_runner_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (chat stream): no buffering/caching (mirror portal-bi-path.conf)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://bi_fe_runner_api/health;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
