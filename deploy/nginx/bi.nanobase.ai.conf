# bi.nanobase.ai — standalone Nanobase BI frontend + runner API (:8787)
# Analytics embed: portal.nanobase.ai:8443 (portal-analytics-8443.conf).
# Install:
#   sudo cp ... /etc/nginx/sites-available/bi.nanobase.ai.conf
#   sudo ln -sf /etc/nginx/sites-available/bi.nanobase.ai.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d bi.nanobase.ai
#   sudo nginx -t && sudo systemctl reload nginx

upstream bi_runner_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name bi.nanobase.ai;

    ssl_certificate /etc/letsencrypt/live/bi.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.nanobase.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    root /data/nanobaseai/bi/portal/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://bi_runner_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://bi_runner_api/health;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name bi.nanobase.ai;
    return 301 https://$host$request_uri;
}
