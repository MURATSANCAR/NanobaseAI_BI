# portal.nanobase.ai:8443 — public Apache Superset embed host
# Internal upstream: 127.0.0.1:8089 (infra/docker/superset)
# BI_SUPERSET_PUBLIC_URL=https://portal.nanobase.ai:8443
#
# Install:
#   sudo cp deploy/nginx/portal-analytics-8443.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/portal-analytics-8443.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: reuse portal cert or issue for portal.nanobase.ai (same SAN).

upstream nanobase_superset {
    server 127.0.0.1:8089;
    keepalive 8;
}

server {
    listen 8443 ssl http2;
    server_name portal.nanobase.ai;

    ssl_certificate /etc/letsencrypt/live/portal.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.nanobase.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Allow embedding from portal + bi hosts
    add_header Content-Security-Policy "frame-ancestors 'self' https://portal.nanobase.ai https://bi.nanobase.ai http://localhost:5173 http://127.0.0.1:5173" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://nanobase_superset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Embedded SDK needs cookies / guest header through
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
