# Portal :443 — mount NanobaseAI-BI under https://portal.nanobase.ai/bi/
# Pair with portal hub SPA at / (MobilTest). Prefer this over :8445 redirect.
#
# Static:  /data/nanobaseai/bi/portal/dist  (Vite base=/bi/)
# API:     /bi-api/ → DB-GPT bridge :8787  (optional dedicated prefix)
#          also /api/ when BI is primary; if portal already owns /api, use /bi-api/
#
# Include from portal site config or merge into the existing portal.nanobase.ai server block.

upstream bi_dbgpt_bridge {
    server 127.0.0.1:8787;
    keepalive 8;
}

# --- fragment to merge into portal.nanobase.ai :443 server { } ---
#
# location = /bi {
#     return 302 /bi/;
# }
#
# location /bi/ {
#     alias /data/nanobaseai/bi/portal/dist/;
#     try_files $uri $uri/ /bi/index.html;
# }
#
# # Assets emitted with Vite base=/bi/
# location /bi/assets/ {
#     alias /data/nanobaseai/bi/portal/dist/assets/;
#     expires 1y;
#     add_header Cache-Control "public, immutable";
# }
#
# # Bridge (FE → DB-GPT adapter). Keep portal /api for QA if needed.
# location /bi-api/ {
#     rewrite ^/bi-api/(.*)$ /api/$1 break;
#     proxy_pass http://bi_dbgpt_bridge;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_buffering off;
#     proxy_read_timeout 3600s;
# }
#
# location /bi-health {
#     proxy_pass http://bi_dbgpt_bridge/health;
# }

server {
    listen 8445 ssl http2;
    server_name portal.nanobase.ai;

    ssl_certificate /etc/letsencrypt/live/portal.nanobase.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.nanobase.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;
    root /data/nanobaseai/bi/portal/dist;
    index index.html;

    location /bi/assets/ {
        alias /data/nanobaseai/bi/portal/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /bi {
        return 302 /bi/;
    }

    location /bi/ {
        alias /data/nanobaseai/bi/portal/dist/;
        try_files $uri $uri/ /bi/index.html;
    }

    # Same-origin API for this BI host (bridge → DB-GPT)
    location /api/ {
        proxy_pass http://bi_dbgpt_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://bi_dbgpt_bridge/health;
    }

    # Legacy root → /bi/
    location = / {
        return 302 /bi/;
    }

    location / {
        try_files $uri $uri/ /bi/index.html;
    }
}
