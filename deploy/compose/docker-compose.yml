# NanobaseAI BI — tek paket müşteri kurulumu
#
#   ./install.sh                 → tüm servisleri kurar (LLM harici ise sadece adresini ister)
#   ./install.sh --with-gpu-llm  → LLM'i de bu makinede (NVIDIA GPU) çalıştırır
#   ./add-datasource.sh ...      → müşteri veritabanını (uzak Postgres, salt-okunur) bağlar
#
# Profiller:
#   gpu-llm    : yerel LLM servisi (NVIDIA GPU + nvidia-container-toolkit gerekir)
#   analytics  : Apache Superset tabanlı analitik panel (isteğe bağlı)
#   demo       : örnek raporlama veritabanı (yalnız demo/eğitim; müşteri verisi uzak DB'den gelir)

name: nanobaseai-bi

x-backend-env: &backend-env
  NANOBASE_ENV: production
  PYTHONPATH: /app/backend
  PYTHONUNBUFFERED: "1"
  # Meta veritabanı (kaynaklar, katalog, senaryolar, bütçe, denetim)
  NANOBASE_META_DSN: postgresql+psycopg2://bi_meta:${META_DB_PASSWORD}@meta-db:5432/bi_meta
  REDIS_URL: redis://redis:6379/0
  ARQ_ENABLED: "1"
  QDRANT_URL: http://qdrant:6333
  # Müşteri SQL'i yalnız Query Gateway üzerinden çalışır
  QUERY_GATEWAY_BASE: http://gateway:8792
  NANOBASE_TEXT2SQL_EXECUTION_MODE: QUERY_GATEWAY
  QG_USE_INTERNAL_API: "1"
  QG_SERVICE_JWT_SECRET: ${QG_SERVICE_JWT_SECRET}
  QG_HMAC_SECRET: ${QG_HMAC_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  # Dev auth serves every request as an administrator; the API refuses to start with it when
  # NANOBASE_ENV=production. Set AUTH_MODE and JWT_SECRET in .env before bringing this up.
  AUTH_MODE: ${AUTH_MODE:-jwt}
  DEV_TENANT_ID: ${DEV_TENANT_ID:-default}
  SECRETS_ROOT: /secrets
  BI_DIR: /data
  BI_SOURCES_FILE: /data/connection.json
  SCHEMA_INDEXER_ROOT: /app/tools/schema-indexer
  NANOBASE_PYTHON: python
  # LLM (OpenAI uyumlu). Harici GPU sunucusu veya gpu-llm profili.
  OPENAI_API_BASE: ${LLM_API_BASE:-http://llm:8080/v1}
  OPENAI_API_KEY: ${LLM_API_KEY}
  LLM_MODEL_NAME: ${LLM_MODEL_NAME:-nanobaseai-bi-llm}
  LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-300}
  LLM_HEALTH_CACHE_SEC: "30"
  LLM_REPEAT_PENALTY: "1.0"
  MODEL_MAX_CONCURRENCY: ${LLM_PARALLEL:-1}
  MODEL_QUEUE_LIMIT: "100"
  MODEL_QUEUE_TIMEOUT: "360"
  TEXT2SQL_PREFER: chat
  TEXT2SQL_FALLBACK_TO_CHAT: "1"
  TEXT2SQL_MAX_COMPLETION_TOKENS: "2048"
  TEXT2SQL_CONTEXT_CHARS: "9000"
  TEXT2SQL_REPAIR_MAX: "2"
  # Şema gömme servisi (paket içi)
  BI_EMBED_URL: http://embedding:8080/v1/embeddings
  BI_EMBED_API_KEY: ${EMBED_API_KEY}
  SEMANTIC_CATALOG_ENABLED: "1"
  BI_SEMANTIC_LAYER_ENABLED: "1"
  # Tahmin (forecast) servisi — plan: docs/architecture/forecasting-v1-plan.md
  FORECAST_API_BASE: http://forecast:8793
  FORECAST_CHAT_ENABLED: ${FORECAST_CHAT_ENABLED:-true}
  FORECAST_HISTORY_MONTHS: ${FORECAST_HISTORY_MONTHS:-36}
  # Eski sohbet motoru köprüsü kullanılmıyor; sağlık sondası için kapalı adres
  DBGPT_BASE: http://127.0.0.1:9
  # Analitik panel (profil: analytics)
  BI_SUPERSET_ENABLED: ${ANALYTICS_ENABLED:-false}
  BI_SUPERSET_URL: http://superset:8088
  BI_SUPERSET_PUBLIC_URL: ${ANALYTICS_PUBLIC_URL:-}
  BI_SUPERSET_USERNAME: ${ANALYTICS_ADMIN_USERNAME:-nanobaseai-bi-svc}
  BI_SUPERSET_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:-}
  BI_SUPERSET_GUEST_SECRET: ${ANALYTICS_GUEST_SECRET:-}
  BI_SUPERSET_GUEST_AUDIENCE: http://0.0.0.0:8080/

x-backend-volumes: &backend-volumes
  - ${DATA_DIR:-./data}:/data
  - ${SECRETS_DIR:-./secrets}:/secrets

services:
  meta-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_meta
      POSTGRES_USER: bi_meta
      POSTGRES_PASSWORD: ${META_DB_PASSWORD}
    volumes:
      - meta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_meta -d bi_meta"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bi]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [bi]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bi]

  # Şema/senaryo gömme servisi — paket içi, dış bağımlılık yok (OpenAI uyumlu /v1/embeddings)
  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >
      --model /models/embedding/${EMBED_MODEL_FILE:-bge-m3-Q8_0.gguf}
      --alias nanobaseai-bi-embed
      --embedding --pooling cls
      -c 8192 -ub 8192 -b 8192
      --host 0.0.0.0 --port 8080
      -t ${EMBED_THREADS:-4}
      --api-key ${EMBED_API_KEY}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [bi]

  # Yerel LLM (profil: gpu-llm). Harici sunucu kullanılıyorsa LLM_API_BASE ile atlanır.
  llm:
    profiles: ["gpu-llm"]
    build:
      context: ./llm
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-refs/pull/28243/head}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: nanobaseai-bi/llm:latest
    restart: unless-stopped
    environment:
      LLM_MODEL_FILE: /models/llm/${LLM_MODEL_FILE}
      LLM_DRAFT_FILE: /models/llm/${LLM_DRAFT_FILE:-}
      LLM_ALIAS: ${LLM_MODEL_NAME:-nanobaseai-bi-llm}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_CTX: ${LLM_CTX:-24576}
      LLM_PARALLEL: ${LLM_PARALLEL:-1}
      LLM_N_CPU_MOE: ${LLM_N_CPU_MOE:-999}
      LLM_MTP_N_MAX: ${LLM_MTP_N_MAX:-3}
      LLM_THREADS: ${LLM_THREADS:-16}
      LLM_BATCH: ${LLM_BATCH:-2048}
      LLM_UBATCH: ${LLM_UBATCH:-512}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 300s
    networks: [bi]

  # Tahmin servisi: SeriesBundle → p10/p50/p90. Varsayılan motor benchmark kapısına bağlı.
  forecast:
    build:
      context: ../..
      dockerfile: deploy/compose/forecast/Dockerfile
      args:
        WITH_TIMESFM: ${FORECAST_WITH_TIMESFM:-1}
    image: nanobaseai-bi/forecast:latest
    restart: unless-stopped
    environment:
      FORECAST_ENGINE: ${FORECAST_ENGINE:-timesfm3}
      FORECAST_THREADS: ${FORECAST_THREADS:-4}
      FORECAST_MODEL3_ID: ${FORECAST_MODEL3_ID:-google/timesfm-3.0-pytorch}
      FORECAST_ALLOW_NONCOMMERCIAL: ${FORECAST_ALLOW_NONCOMMERCIAL:-1}
      FORECAST_DEVICE: cpu
      HF_HOME: /models/forecast
    volumes:
      - ${MODELS_DIR:-./models}:/models
    cpus: ${FORECAST_CPUS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8793/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [bi]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/gateway/Dockerfile
    image: nanobaseai-bi/gateway:latest
    restart: unless-stopped
    environment:
      QUERY_GATEWAY_PORT: "8792"
      SECRETS_ROOT: /secrets
      REDIS_URL: redis://redis:6379/1
      QG_SERVICE_JWT_SECRET: ${QG_SERVICE_JWT_SECRET}
      QG_HMAC_SECRET: ${QG_HMAC_SECRET}
      QG_MAX_ROWS: ${QG_MAX_ROWS:-1000}
      QG_STATEMENT_TIMEOUT_S: ${QG_STATEMENT_TIMEOUT_S:-30}
      # Demo profili için yerel raporlama DB'si
      REPORTING_HOST: demo-db
      REPORTING_PORT: "5432"
      REPORTING_DB: bi_reporting
    volumes:
      - ${SECRETS_DIR:-./secrets}:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8792/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bi]

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/api/Dockerfile
    image: nanobaseai-bi/api:latest
    restart: unless-stopped
    environment:
      <<: *backend-env
      NANOBASE_API_PORT: "8790"
      REPORTING_HOST: demo-db
      REPORTING_PORT: "5432"
      REPORTING_DB: bi_reporting
    volumes: *backend-volumes
    depends_on:
      meta-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gateway:
        condition: service_healthy
      forecast:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/api/v1/bi/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    networks: [bi]

  worker:
    image: nanobaseai-bi/api:latest
    restart: unless-stopped
    command: ["arq", "nanobase_api.infrastructure.arq_worker.WorkerSettings"]
    environment:
      <<: *backend-env
      REPORTING_HOST: demo-db
      REPORTING_PORT: "5432"
      REPORTING_DB: bi_reporting
    volumes: *backend-volumes
    depends_on:
      api:
        condition: service_healthy
    networks: [bi]

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web/Dockerfile
      args:
        VITE_BASE: ${WEB_BASE_PATH:-/}
    image: nanobaseai-bi/web:latest
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [bi]

  # --- isteğe bağlı: demo raporlama DB'si (profil: demo) ---
  demo-db:
    profiles: ["demo"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_reporting
      POSTGRES_USER: bi_reporting_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/reporting_admin_password
    secrets:
      - reporting_admin_password
      - reporting_ro_password
    volumes:
      - demo-db-data:/var/lib/postgresql/data
      - ../../infra/sql/01-reporting-seed.sql:/docker-entrypoint-initdb.d/01-reporting-seed.sql:ro
      - ../../infra/sql/02-reporting-ro-user.sh:/docker-entrypoint-initdb.d/02-reporting-ro-user.sh:ro
      - ../../infra/sql/08-reporting-rich-schema.sql:/docker-entrypoint-initdb.d/08-reporting-rich-schema.sql:ro
      - ../../infra/sql/09-sales-revenue-lines-view.sql:/docker-entrypoint-initdb.d/09-sales-revenue-lines-view.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_reporting_admin -d bi_reporting"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bi]

  # --- isteğe bağlı: analitik panel (profil: analytics) ---
  superset-db:
    profiles: ["analytics"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-change_me}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bi]

  superset:
    profiles: ["analytics"]
    image: apache/superset:4.0.2
    restart: unless-stopped
    depends_on:
      superset-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${ANALYTICS_SECRET_KEY:-change_me}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:${ANALYTICS_DB_PASSWORD:-change_me}@superset-db:5432/superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GUEST_TOKEN_JWT_SECRET: ${ANALYTICS_GUEST_SECRET:-}
      GUEST_TOKEN_JWT_AUDIENCE: http://0.0.0.0:8080/
      SUPERSET_CORS_ORIGINS: ${ANALYTICS_CORS_ORIGINS:-http://localhost}
      SUPERSET_DEFAULT_LOCALE: tr
      ADMIN_USERNAME: ${ANALYTICS_ADMIN_USERNAME:-nanobaseai-bi-svc}
      ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ANALYTICS_ADMIN_EMAIL:-bi@localhost}
    volumes:
      - ../../infra/docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../../infra/docker/superset/docker-entrypoint.sh:/app/docker-entrypoint-nanobase.sh:ro
      - superset-home:/app/superset_home
    entrypoint: ["/bin/bash", "/app/docker-entrypoint-nanobase.sh"]
    networks: [bi]

secrets:
  reporting_admin_password:
    file: ${SECRETS_DIR:-./secrets}/reporting-admin.password
  reporting_ro_password:
    file: ${SECRETS_DIR:-./secrets}/reporting-ro.password

volumes:
  meta-db-data:
  redis-data:
  qdrant-data:
  demo-db-data:
  superset-db-data:
  superset-home:

networks:
  bi:
    name: nanobaseai-bi
