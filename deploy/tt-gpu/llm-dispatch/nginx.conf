# İki karttaki aynı modele (Qwen3.8-27B-FP8) tek kapı. BI ve müşteri VM'inin bütün
# prompt'ları ters tünelden (editor-gpu-tunnel, CPU 127.0.0.1:18885) buraya gelir.
#
#   GPU 0  qwen38-27b             her zaman açık — BI'ın asıl kartı
#   GPU 1  editor-model-director  yedek: yalnız GPU 0 cevap veremezse (kap düşük/yeniden başlıyor)
#
# 2026-10-02 (arşiv okuması, ~4.000 kitap): GPU 1 gün boyu kitap okumasıyla dolu (KV 13-15 istekte
# doluyor, günün %47'si görsel modelde). least_conn BI isteğini bu kuyruğa da gönderiyordu; GPU 0'da ise
# BI öncelikli (vLLM --scheduling-policy priority, taşan okuma düşük öncelik). Bu yüzden BI hep GPU 0'a
# gider, GPU 1 `backup`: GPU 0 bağlantıyı reddeder / 502-503-404 dönerse istek aynı anda GPU 1'e geçer.
worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    # Docker'ın iç DNS'i: GPU 1'deki kap durup kalkınca adresi değişir, 5 sn'de bir sorulur.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream llm {
        zone llm 64k;
        least_conn;
        server qwen38-27b:8000            resolve max_fails=1 fail_timeout=10s;
        server editor-model-director:8000 resolve max_fails=1 fail_timeout=10s backup;
    }

    server {
        listen 8080;
        client_max_body_size 64m;

        location = /dispatch/health { return 200 "ok\n"; }

        location / {
            proxy_pass http://llm;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Akış (SSE) cevapları beklemeden geçer; gövde tamponlanır ki istek başka karta
            # yeniden gönderilebilsin.
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            # Cevap başlamadan düşen istek öteki karta gider. 404: kart `nanobaseAI` adını
            # henüz tanımıyorsa (eski kap). Prompt'un yan etkisi yok, POST yeniden denenebilir.
            proxy_next_upstream error timeout http_502 http_503 http_404 non_idempotent;
            proxy_next_upstream_tries 2;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
