# CPU host only: a dedicated forwarding account, not an interactive login.
Match User editor-gpu-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:18885 127.0.0.1:18887
    PermitOpen none
    GatewayPorts no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
Match all
