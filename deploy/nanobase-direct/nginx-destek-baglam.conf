# NanobaseAI Destek temsilci paneli → M51 müşteri bağlamı ucu (köprü /api/v1/support/panel/*).
# portal.nanobase.ai server bloğuna, destek-llm snippet'inin yanına include edilir:
#   sudo cp deploy/nanobase-direct/nginx-destek-baglam.conf /etc/nginx/snippets/destek-baglam.conf
#   anahtar satırı kurulumda /etc/nanobase/destek-llm.key'den yazılır (aynı masa, aynı anahtar); depoda yer tutucu.
# Koruma: 256-bit Bearer anahtarı (TLS) + köprünün çağıran jetonu (burada eklenir) + köprüde temsilcinin portal yetkisi
# (X-Destek-Agent). Çerez köprüye gitmez: panel isteği kişi oturumu değil, masanın sunucusudur.
# Yalnız GET ve taslak için POST; masa bağlamı yalnız okur.
location ^~ /destek-baglam/v1/ {
    allow all;
    if ($http_authorization != "Bearer __DESTEK_LLM_KEY__") { return 401; }
    limit_except GET POST { deny all; }
    include /etc/nginx/snippets/timas-semantic-caller.conf;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass http://127.0.0.1:8795/api/v1/support/panel/;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    client_max_body_size 1m;
    access_log /var/log/nginx/destek-baglam.access.log;
}
